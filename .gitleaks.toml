# Gitleaks config — secret scanning for the `secrets` CI job (see
# .github/workflows/ci.yml) and for manual scans (`make check-secrets`).
#
# Full default ruleset, plus path allowlists for directories that are not our
# source code. The allowlists are all *vendored, generated, or local-runtime*
# paths — never application code, so the scan stays strict everywhere it
# matters. Individual known findings in real source files are suppressed by
# fingerprint in .gitleaksignore, where each one is commented, rather than by
# widening these globs.

[extend]
useDefault = true

[allowlist]
description = "Vendored, generated, and local-runtime paths — not our source"
paths = [
  # Dependencies and build output.
  '''node_modules/''',
  '''\.venv/''',
  '''coverage/''',
  '''reports/''',
  '''\.stryker-tmp/''',
  '''mutants/''',
  '''playwright-report/''',
  '''test-results/''',

  # Agent worktrees are full copies of the tree; scanning them double-reports
  # every finding against a path that is not the real file.
  '''\.claude/worktrees/''',

  # LOCAL RUNTIME DATA — these hold genuine secrets (a real config.ini with API
  # keys, generated media.key/tetchy.key private keys, logs). They are
  # gitignored (.gitignore lines 5, 26, 57) and verified untracked, so they can
  # never reach the remote; excluding them keeps a local `make check-secrets`
  # usable instead of drowning in 40+ hits from your own dev instance.
  # If you ever see one of these paths reported as TRACKED, that is a real leak.
  #
  # NOTE the `(^|/)` prefix rather than a bare `^`: gitleaks reports paths
  # relative to --source, so a container scan of /repo yields
  # `/repo/.config/config.ini`. A `^\.config/` anchor silently matches nothing
  # there — the allowlist looks correct and suppresses zero findings.
  '''(^|/)\.config/''',
  '''(^|/)data/config/''',
  '''(^|/)\.e2e-[^/]*data/''',
  '''(^|/)test_data/''',
]
