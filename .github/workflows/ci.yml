name: CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  # Nightly, so the browser suites run against master even in a week with no
  # UI changes. Without this, "coverage follows the change surface" would mean
  # a long run of Python-only work never exercises the UI at all.
  schedule:
    # 15:00 UTC. Australia/Sydney is UTC+10 in winter and UTC+11 under
    # daylight saving, so this lands at 01:00 or 02:00 local depending on the
    # season. Off-peak either way, and GitHub cron has no timezone, so the
    # drift is accepted rather than worked around.
    - cron: '0 15 * * *'

permissions:
  contents: read

# Supersede an in-flight run when a branch is pushed again — CI on the old commit
# is already irrelevant by then, and this suite runs ~10 jobs including E2E and a
# Docker build. `cancel-in-progress` is safe HERE (a read-only test suite) but
# deliberately false in docker.yml / release-to-prod.yml, where a cancelled run
# would leave a half-published image.
concurrency:
  # `github.event_name` is part of the key, and that is the whole point.
  #
  # A `schedule` run against the default branch has `github.ref` of
  # refs/heads/master -- the SAME ref a `push` to master has. Keyed on ref
  # alone, the nightly and a master push shared one group with
  # cancel-in-progress, so a merge landing near 15:00 UTC killed one or the
  # other. Silently: a cancelled run is not a red run, so nothing pages and
  # the nightly simply stops happening on the weeks anything gets merged.
  #
  # That defeats the reason the nightly exists -- a quiet week of Python-only
  # work still has to exercise the UI against master, and "quiet" is exactly
  # when nobody would notice it had not.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Answers "do the browser suites need to run?" ONCE, via the same script the
  # pre-push hook calls. Sharing the script is the point: two copies of "what
  # counts as a UI change" drift, and the quieter side then silently stops
  # covering something.
  #
  # Always YES on master and on the nightly run -- the change-surface rule is a
  # PR-time optimisation, not a reduction in what master is held to.
  scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      browser: ${{ steps.decide.outputs.browser }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0        # needs_e2e.sh diffs against the base
    - id: decide
      # Context values go through `env:`, never spliced into `run:`. Not
      # exploitable today (the pull_request trigger is filtered to two literal
      # branches), but it is the shape GitHub's hardening guide flags, and it
      # is one careless widening of that filter away from being real.
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_REF: ${{ github.base_ref }}
      run: |
        set -euo pipefail
        if [ "$EVENT_NAME" != "pull_request" ]; then
          echo "not a pull request ($EVENT_NAME) -- browser suites always run"
          echo "browser=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # The classifier is taken from the BASE branch, never from the PR.
        #
        # `actions/checkout` gives us the PR's own merge ref, so running
        # ./scripts/needs_e2e.sh from the working tree would let a PR that
        # edits the classifier decide whether the classifier's own change
        # needs browser tests. An author could make it `exit 1`
        # unconditionally, both required browser jobs would skip, and a
        # skipped job SATISFIES a required check -- so the change that
        # disabled the gate would merge without ever running it.
        #
        # Having `scripts/needs_e2e.sh` inside UI_PATTERNS does not fix that:
        # the entry only forces a full run while it is still there, and the
        # PR being defended against is the one that removes it.
        #
        # The base copy is what master is already protected by, so it is the
        # only version with any authority over what merges into master.
        CLASSIFIER="$(mktemp)"
        if ! git show "origin/$BASE_REF:scripts/needs_e2e.sh" > "$CLASSIFIER" 2>/dev/null; then
          # The base branch has no classifier. True for the PR that
          # INTRODUCES it -- which is how this was found, by the job failing
          # on its own PR -- and for any branch cut before it landed.
          #
          # Run the browser suites. There is no trusted answer available, and
          # "no trusted answer" resolves the same way every other uncertainty
          # in this gate does.
          echo "no classifier on origin/$BASE_REF -- browser suites run"
          echo "browser=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        chmod +x "$CLASSIFIER"

        if "$CLASSIFIER" "origin/$BASE_REF"; then
          echo "browser=true" >> "$GITHUB_OUTPUT"
        else
          echo "browser=false" >> "$GITHUB_OUTPUT"
        fi

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7

    # node: check_test_traps.py rule 8 parses each template's inline <script>
    # with `node --check` on stdin -- runtime only, no npm install. The rule
    # fails HARD without it (AC-QA-74: skipping silently is worse than no
    # gate), so this step and that rule land together.
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    - name: Install ruff
      run: pip install 'ruff==0.16.1'

    - name: Run ruff
      run: ruff check .

    # pyyaml: check_test_traps.py parses workflow files with a real YAML parser
    # rather than a hand-rolled scanner. Cheap, and it removes a whole class of
    # false positives/negatives around block scalars and inline comments.
    - name: Install test-trap guard deps
      run: pip install 'pyyaml>=6.0'

    # False-green guard: jsdom layout-zero reads in vitest specs, test runners
    # piped into filters without pipefail (the pipeline reports the filter's exit
    # status), shell gates missing `set -euo pipefail`, and non-executable git
    # hooks. Stdlib plus PyYAML (installed above), so it rides along in this job
    # rather than paying for another runner.
    # See scripts/check_test_traps.py and CLAUDE.md rules 9-11.
    - name: Run test-trap check
      run: python scripts/check_test_traps.py --require-git

  # Fast static guardrail for the modern UI (couchpotato/ui/templates/**):
  # off-spec toggle sizing, legacy icon-font classes, raw hex colors. Pure
  # stdlib, no build/deps, so it's cheap to run as its own gating job. See
  # scripts/check_conformance.py and specs/UI-CONFORM-02-ci-guardrail.md.
  conformance:
    name: conformance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    - name: Run UI conformance check
      run: python scripts/check_conformance.py

  # Secret scanning. Gitleaks over the working tree, pinned to an immutable
  # version tag (:v8.30.1 — a tag, not a @sha256 digest; bump it deliberately,
  # since an unpinned :latest changes the ruleset under you).
  #
  # NOTE: this job IS a required status check on `master` (enabled 2026-07-31,
  # right after the PR that added it merged). A red `secrets` blocks the merge.
  # If you ever remove or rename this job, drop it from branch protection in the
  # same change — a required context that no workflow produces blocks every PR
  # forever, waiting for a check that never reports.
  #
  # WORKING TREE, NOT FULL HISTORY, deliberately: this repo carries ~5,250
  # commits inherited from upstream CouchPotato (5,813 total), and a
  # full-history scan reports 37 findings, 31 of them upstream's own committed
  # provider keys spanning 2011-2017. See `make check-secrets-history` for the
  # full breakdown, including the 6 authored by this fork. A gate that
  # is red on arrival gets ignored or disabled, so this check answers the
  # question that can actually be actioned — "is there a secret in the code as it
  # stands?" — and the two known upstream keys still present are baselined by
  # fingerprint, with justification, in .gitleaksignore.
  #
  # Trade-off worth knowing: a secret added and then deleted within the same
  # branch is not caught here (it is gone from the tree but alive in history).
  # `make check-secrets-history` does the full-history scan for that case; run it
  # if a credential is ever suspected to have been committed.
  #
  # A range-based scan was considered and rejected: if the base/head range ever
  # computes empty, gitleaks scans nothing and the job passes green — a
  # false-green in the very gate meant to prevent them (cf. CLAUDE.md rule 10).
  # The tree scan always has files, so it cannot silently no-op.
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7

    - name: Gitleaks (working tree)
      run: |
        docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.30.1 \
          detect --source=. --no-git --config=.gitleaks.toml --no-banner --redact -v

  # Static security lint (ruff's flake8-bandit "S" rules). INFORMATIONAL for now:
  # the legacy codebase has ~169 S findings, so this does not gate merges yet.
  # Triage the annotations and ratchet specific S codes into the blocking `lint`
  # job (pyproject [tool.ruff.lint] select) as they're cleared.
  security-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    - name: Install ruff
      run: pip install 'ruff==0.16.1'

    - name: ruff security lint (bandit S rules)
      continue-on-error: true
      run: ruff check --select S --output-format=github couchpotato/ CouchPotato.py

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    strategy:
      matrix:
        # EXACTLY the interpreter production ships (Dockerfile's
        # python:3.14-alpine). Kept as a matrix of one so the job name
        # stays `test (3.14)` -- it is a required status check, and a
        # renamed context blocks every PR waiting for a check nothing
        # publishes.
        #
        # Was 3.10-3.14. Dropped 2026-08-09 on measurement, not taste:
        # across 59 CI runs no leg ever failed, and no run ever had legs
        # disagree. There is no `requires-python` anywhere, prod is
        # pinned to 3.14-alpine and the only dev venv is 3.14.6, so the
        # other four legs tested configurations nobody runs -- 15.6
        # runner-minutes per push, on the critical path, since
        # ui-e2e-tests/test-summary/docker all `needs: test` and waited
        # on the SLOWEST leg (3.10).
        #
        # test_ci_matrix_tests_exactly_the_dockerfile_version enforces that this
        # list is exactly [Dockerfile version]; re-broadening it is a
        # deliberate act that must change that test too.
        python-version: ['3.14']
      fail-fast: false

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements*.txt') }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run tests
      env:
        PYTHONPATH: ${{ github.workspace }}/libs
      run: |
        python -m pytest tests/unit/ -v --tb=short -W ignore::SyntaxWarning

    - name: Run integration tests
      env:
        PYTHONPATH: ${{ github.workspace }}/libs
      run: |
        python -m pytest tests/integration/ -v --tb=short -W ignore::SyntaxWarning

    - name: Check core modules import
      env:
        PYTHONPATH: ${{ github.workspace }}/libs
      run: |
        python -c "
        import sys
        sys.path.insert(0, '.')
        for mod in ['couchpotato.api', 'couchpotato.core.settings', 'couchpotato.core.database']:
            __import__(mod)
            print(f'OK: {mod}')
        "

  ui-unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
    
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run unit tests
      run: npm run test:unit

  ui-e2e-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    needs: [test, ui-unit-tests, scope]
    # Skipped when nothing browser-visible changed. GitHub reports a skipped
    # job as satisfying a required status check, which is what keeps such a PR
    # mergeable -- and that is a deliberate reliance, recorded here because it
    # is the same GitHub behaviour that once let the accessibility verdict be
    # ABSENT rather than red on broken branches. It is acceptable only because
    # the skip is decided by the change surface and master/nightly always run.
    #
    # And it is why this condition FAILS CLOSED. Keying on `== 'true'` meant a
    # scope job that died before writing its output -- failed checkout,
    # classifier that would not run -- skipped both browser jobs and left the
    # PR mergeable with no E2E and no accessibility coverage at all. Only an
    # explicit 'false' is safe to skip on. `!cancelled()` is required because
    # the implicit success() of `needs:` would otherwise skip this job before
    # the condition is read.
    if: >-
      !cancelled()
      && needs.test.result == 'success'
      && needs.ui-unit-tests.result == 'success'
      && needs.scope.outputs.browser != 'false'
    steps:
    - uses: actions/checkout@v7
    
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'
    
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Install Node dependencies
      run: npm ci

    # Tail fix, not a median one: this step is normally ~27s, but it is the
    # ONLY step here that has ever stalled (610s of a 697s job, run
    # 92791614728). SYMPTOM that this stopped working: the job back at several
    # minutes with "Install Playwright browsers" dominating. CHECK: the
    # cache-hit line in this job's log, or `gh cache list`.
    #
    # DO NOT ADD `restore-keys:`. A prefix fallback restores an older chromium
    # generation, and the install below then adds a second one beside it
    # rather than replacing it.
    #
    # What actually protects this cache, stated precisely because the first
    # version of this comment got it wrong and review disproved it by
    # experiment: `playwright install` repairs a MISSING cache but TRUSTS a
    # present INSTALLATION_COMPLETE marker verbatim -- planting that marker in
    # an empty directory makes the install skip the download entirely. So the
    # integrity boundary is GitHub's cache scoping (fork-PR caches are not
    # restorable by default-branch runs) plus the exact-match key below. It is
    # NOT the unconditional install.
    #
    # Quota: 6.60 GB of the 10 GB per-repo limit is already in use across 272
    # entries (measured 2026-08-08), and eviction is silent LRU. Keep this key
    # a function of OS + resolved Playwright version only, never per-commit or
    # per-branch, or it will quietly evict the pip and npm caches.
    #
    # ui-e2e-tests and accessibility now start together and race for this same
    # key on a cold cache: both miss, both install, one save wins and the other
    # logs a benign "already exists" conflict. Correct, just noisy once per
    # dependency bump.
    - name: Cache Playwright browsers
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

    # Deliberately NOT gated on cache-hit: a cache miss must never leave the
    # suite running against no browser.
    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium

    # T1.7: tests/e2e/fixtures.ts starts its own CouchPotato server per
    # Playwright worker -- own port, own data dir, seeded before that
    # worker's server starts -- identically to a local run. No more
    # hand-started server, and no more seed step whose failure only earned
    # a `::warning::` (AC-OPS-16): a failed seed now fails the run, same as
    # locally.
    #
    # --fail-on-flaky-tests (AC-A11Y-4/QA-56): this job keeps `retries: 2`
    # (playwright.config.ts), so without this flag a test that fails once
    # and passes on retry would report green here -- exactly the shape that
    # let a 1-in-5 shared-state race pass as "the suite is green" for a
    # long time.
    - name: Run E2E tests
      env:
        PYTHONPATH: ${{ github.workspace }}/libs
      run: |
        npx playwright test --project=chromium --fail-on-flaky-tests
        # AC-QA-50 isolation proof, pinned to 2 workers (see playwright.config.ts)
        npx playwright test --project=isolation --workers=2 --fail-on-flaky-tests

    # Small-screen coverage. AGENTS.md treats a mobile layout regression that
    # blocks a core flow as high-priority, and the mobile-chrome project sat
    # configured-but-unrun for a long time -- the first review to exercise it
    # found the restore picker overflowing at 441px on a 393px device. Scoped
    # by testMatch to *.mobile.spec.ts, so this is seconds, not minutes. Its
    # own worker(s), own server(s) -- no restart-by-hand step needed any more.
    - name: Run mobile E2E tests
      env:
        PYTHONPATH: ${{ github.workspace }}/libs
      run: npx playwright test --project=mobile-chrome --fail-on-flaky-tests

    - name: Upload test artifacts
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: playwright-report
        # test-results/ carries the per-worker application logs that
        # tests/e2e/fixtures.ts writes (server-p<N>-w<M>.log). The HTML
        # reporter only copies Playwright ATTACHMENTS into
        # playwright-report/, so a file the fixture writes directly was not
        # carried across, and the one artefact that can explain a mid-run
        # server death died with the runner.
        #
        # Checked before adding it, and THIS IS THE WHOLE OF WHAT IS CHECKED.
        # PrivacyFilter (couchpotato/core/logger.py) is attached to the console
        # and file HANDLERS, so it only rewrites records that pass through
        # them: raw stderr (an interpreter traceback, a bare print) does not.
        # It replaces the configured api_key wherever it appears, and the
        # values of api/apikey/api_key/password/username/h/uid/key/passkey when
        # they appear as `?name=` or `&name=` query parameters. Nothing else.
        # Request paths, which embed the api_key, never reach the log at all:
        # runner.py passes access_log=False. Verified against a real captured
        # log: no 32-char hex token, every `api_key=` reads `xxx`, no request
        # lines.
        #
        # NOT covered: filesystem paths (on a runner those are
        # /home/runner/work/..., not anyone's home directory), credentials in
        # URL userinfo, and any secret in a URL path segment other than the
        # api_key. The reason this is safe is that the E2E instance holds
        # seeded fixture data and no third-party credentials, NOT that the
        # filter is comprehensive. If that ever stops being true, this upload
        # is the thing to revisit first.
        path: |
          playwright-report/
          test-results/
        retention-days: 7

  accessibility:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    needs: [scope]
    # Fail CLOSED. A skipped job satisfies a required status check on GitHub,
    # so keying on `== 'true'` meant that a scope job which died before writing
    # its output -- failed checkout, classifier that would not run -- skipped
    # both browser jobs and left the PR mergeable with no E2E and no
    # accessibility coverage. Only an explicit 'false' is safe to skip on.
    # `!cancelled()` is required because the implicit success() of `needs:`
    # would otherwise skip this job before the condition is read at all.
    if: >-
      !cancelled()
      && needs.scope.outputs.browser != 'false'
    # `needs: [scope]` ONLY -- scope is seconds, so this still starts almost
    # immediately and does not re-enter the serial chain CI-003 removed it
    # from. Was `needs: ui-e2e-tests`, added 2026-02-16
    # in 40539241 with no stated reason and no data dependency: since T1.7 this
    # job starts, seeds and tears down its OWN server on its own runner, so
    # there was no shared state for the edge to sequence. It cost the whole
    # complaint: median offsets from workflow start over 10 runs were
    # accessibility 516->654s for a job taking 138s -- 516 of 656s queueing.
    # Keep the name `accessibility`: it is a REQUIRED status check on master.
    steps:
    - uses: actions/checkout@v7
    
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'
    
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Install Node dependencies
      run: npm ci

    # Same cache as ui-e2e-tests; see the runbook note at that step.
    - name: Cache Playwright browsers
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium

    # T1.7/AC-A11Y-5: this job used to start its own server BY HAND against
    # its own empty .config and never read CP_E2E_DATA_DIR --
    # playwright.config.ts disabled its webServer block whenever CI was
    # set, so isolation implemented only there would have left this job
    # running the OLD shared-state suite while local ran the isolated one:
    # both green, testing different things. tests/e2e/fixtures.ts is not
    # gated on CI at all, so this job now starts (and seeds, and tears
    # down) its own server exactly the same way ui-e2e-tests and a local
    # run do.
    - name: Run accessibility tests
      env:
        PYTHONPATH: ${{ github.workspace }}/libs
      run: npx playwright test --project=accessibility --fail-on-flaky-tests

    - name: Upload accessibility report
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: accessibility-report
        path: playwright-report/
        retention-days: 7

    # test-results/ (which carries the application log) only on failure, NOT
    # on always(). A green run's server log has no diagnostic value, artefacts
    # on a public repo are downloadable by anyone who can see the run, and
    # always() fires on cancellation too. The axe HTML report keeps its
    # always() upload above; see the ui-e2e-tests job for the full scope of
    # what is and is not redacted.
    - name: Upload accessibility server logs
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: accessibility-server-logs
        path: test-results/
        retention-days: 7

  # Summary job for branch protection — requires all test matrix jobs to pass
  test-summary:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Check test matrix
      run: |
        if [ "${{ needs.test.result }}" != "success" ]; then
          echo "Test matrix failed: ${{ needs.test.result }}"
          exit 1
        fi

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    needs: test

    steps:
    - uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    # This job SCANS THE IMAGE, so the image it builds must be a function of
    # the repo and nothing else. It is built without the layer cache on
    # purpose; the ~2 extra minutes buy a deterministic security verdict.
    #
    # Measured on PR #225, and the reason this is not merely tidy-up. CI
    # reported two fixable HIGHs -- setuptools 70.3.0 (CVE-2025-47273) and
    # msgpack 1.1.2 (GHSA-6v7p-g79w-8964). Neither package is in
    # requirements.txt. A `--no-cache --pull` local build of the same commit,
    # for the same platform (linux/amd64), from the SAME base digest CI
    # resolved (python:3.14-alpine@sha256:a1321512...88f8), contains NEITHER:
    # `ls site-packages` reports neither, pip's own "Successfully installed"
    # line names neither, and the container starts healthy without them.
    # Nothing in the tree imports them.
    #
    # Adding `pull: true` alone did NOT fix it -- the build still reported
    # `#9 COPY requirements.txt CACHED` and `#10 RUN pip install CACHED`,
    # because the base digest was unchanged so the whole chain still matched.
    # The cache holds layers that a clean build of the same inputs does not
    # reproduce, and I could not account for that difference. That is precisely
    # why the cache does not belong in front of a security scan: the verdict
    # was not derivable from the repo.
    #
    # The direction it failed in was harmless -- a false positive on packages
    # the image does not contain. The other direction ships: a stale-but-clean
    # cache reports CLEAN while the live base carries a new CVE.
    - name: Build Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        load: true
        push: false
        pull: true
        no-cache: true
        tags: couchpotato:test

    - name: Test container starts
      run: |
        docker run -d --name cp-test -p 5050:5050 couchpotato:test
        sleep 15
        curl -sf http://localhost:5050/ || (docker logs cp-test && exit 1)
        docker stop cp-test

    # Image vulnerability scan (the manual pre-release Trivy step, now in CI).
    # Alpine base targets 0 CVEs; fail on fixable HIGH/CRITICAL so a regression
    # is caught before release. ignore-unfixed keeps un-patchable upstream CVEs
    # from blocking unrelated PRs; .trivyignore suppresses the DS-0002 false +.
    - name: Scan image with Trivy
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: couchpotato:test
        scanners: vuln
        severity: CRITICAL,HIGH
        ignore-unfixed: true
        trivyignores: .trivyignore
        exit-code: '1'
        format: table
