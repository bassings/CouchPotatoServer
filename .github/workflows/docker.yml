name: Beta Build

# Beta channel: every push to master publishes a new opt-in beta build.
# - Version: minor bump per commit (see scripts/release/next_beta_version.py).
# - Image: pushed to :beta (moving) + :<full-beta-version> (immutable) + :sha-<short>.
#          NEVER :latest — :latest is written only by release-to-prod.yml.
# - Baked CP_VERSION is the BASE version (e.g. 3.10.0, no -beta suffix) so the
#   promoted-to-prod image reports a clean version; the -beta.N identity lives
#   only on the git tag and the GitHub prerelease.
# See specs/FEAT-release-channels.md.

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: write   # create the beta tag + prerelease
  packages: write   # push to GHCR

# Serialize beta builds so two near-simultaneous master pushes can't compute
# the same version and clobber each other's :beta / immutable tag. Never
# cancel an in-flight publish — queue it.
concurrency:
  group: beta-build
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/bassings/couchpotatoserver

jobs:
  beta-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      HAS_DOCKER_CREDS: ${{ secrets.DOCKER_USERNAME != '' }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history + tags for version compute and changelog

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # --- Build once (single-arch, loaded) and smoke-test before publishing ---
      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: couchpotato:test
          pull: true
          no-cache: true

      - name: Smoke-test image
        run: |
          docker run -d --name cp-test -p 5051:5050 couchpotato:test
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:5051/ >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          docker logs cp-test
          docker rm -f cp-test
          test "${ok:-0}" = "1" || { echo "::error::image did not become healthy"; exit 1; }

      # --- Compute the beta version (minor bump per commit) ---
      - name: Compute beta version
        id: ver
        run: |
          FULL="$(python3 scripts/release/next_beta_version.py)"
          BASE="${FULL%%-beta*}"
          SHORT="$(git rev-parse --short HEAD)"
          {
            echo "full=${FULL}"
            echo "base=${BASE}"
            echo "short=${SHORT}"
          } >> "$GITHUB_OUTPUT"
          echo "Beta version: v${FULL} (baked CP_VERSION=${BASE}, sha ${SHORT})"

      # Claim the version by pushing the git tag BEFORE the image exists.
      # The version is derived from `git tag`, so this makes allocation atomic:
      # if any later step fails, a re-run computes the NEXT version and pushes
      # to a fresh immutable tag instead of overwriting this one's bytes. That
      # is what lets release-to-prod.yml trust :<version> as byte-stable.
      - name: Claim the beta version (push git tag)
        run: |
          set -euo pipefail
          TAG="v${{ steps.ver.outputs.full }}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag ${TAG} already exists — refusing to reuse it."
            exit 1
          fi
          git tag "$TAG"
          git push origin "$TAG"
          echo "Claimed ${TAG}"

      # --- Publish beta image to GHCR (multi-arch). NEVER :latest. ---
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push beta image to GHCR
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          # Publish under a run-specific candidate tag. The public beta and
          # immutable version tags appear only after both platforms pass.
          tags: ${{ env.GHCR_IMAGE }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            CP_VERSION=${{ steps.ver.outputs.base }}
          pull: true
          no-cache: true

      - name: Resolve immutable beta image digest
        id: image
        run: |
          set -euo pipefail
          DIGEST="$(docker buildx imagetools inspect "${GHCR_IMAGE}:candidate-${{ github.run_id }}-${{ github.run_attempt }}" --format '{{.Manifest.Digest}}')"
          test -n "$DIGEST"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      # Trivy must fetch the registry image. Without remote mode it can choose
      # a locally loaded image and silently scan the wrong CPU architecture.
      - name: Scan published amd64 image
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_IMAGE_SRC: remote
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ${{ env.GHCR_IMAGE }}@${{ steps.image.outputs.digest }}
          scanners: vuln
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'
          format: table

      - name: Scan published arm64 image
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_IMAGE_SRC: remote
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ env.GHCR_IMAGE }}@${{ steps.image.outputs.digest }}
          scanners: vuln
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'
          format: table

      - name: Move verified beta tags in GHCR
        run: |
          set -euo pipefail
          SOURCE="${GHCR_IMAGE}@${{ steps.image.outputs.digest }}"
          docker buildx imagetools create \
            --tag "${GHCR_IMAGE}:${{ steps.ver.outputs.full }}" \
            --tag "${GHCR_IMAGE}:beta" \
            --tag "${GHCR_IMAGE}:sha-${{ steps.ver.outputs.short }}" \
            "$SOURCE"
          for TAG in "${{ steps.ver.outputs.full }}" beta "sha-${{ steps.ver.outputs.short }}"; do
            ACTUAL="$(docker buildx imagetools inspect "${GHCR_IMAGE}:${TAG}" --format '{{.Manifest.Digest}}')"
            test "$ACTUAL" = "${{ steps.image.outputs.digest }}"
          done

      # --- Optional Docker Hub beta mirror (only if creds configured) ---
      - name: Log in to Docker Hub
        if: env.HAS_DOCKER_CREDS == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Mirror verified beta image to Docker Hub
        if: env.HAS_DOCKER_CREDS == 'true'
        run: |
          set -euo pipefail
          SOURCE="${GHCR_IMAGE}@${{ steps.image.outputs.digest }}"
          docker buildx imagetools create \
            --tag "docker.io/bassings/couchpotato:beta" \
            --tag "docker.io/bassings/couchpotato:${{ steps.ver.outputs.full }}" \
            "$SOURCE"
          ACTUAL="$(docker buildx imagetools inspect "docker.io/bassings/couchpotato:${{ steps.ver.outputs.full }}" --format '{{.Manifest.Digest}}')"
          test "$ACTUAL" = "${{ steps.image.outputs.digest }}"

      # --- Tag + GitHub prerelease (marks it pre-release so :latest users'
      #     updater, which reads /releases/latest, never sees it) ---
      - name: Generate changelog
        id: changelog
        run: |
          set -euo pipefail
          # Exclude the tag we just claimed for THIS build, or the range would
          # be empty (it points at HEAD).
          THIS_TAG="v${{ steps.ver.outputs.full }}"
          LAST_TAG="$(git describe --tags --abbrev=0 --exclude="$THIS_TAG" 2>/dev/null || echo '')"
          if [ -n "$LAST_TAG" ]; then
            CHANGES="$(git log --oneline --no-merges "${LAST_TAG}..HEAD")"
          else
            CHANGES="Initial beta build."
            LAST_TAG="(none)"
          fi
          echo "last_tag=${LAST_TAG}" >> "$GITHUB_OUTPUT"
          {
            echo "changes<<CHANGELOG_EOF"
            echo "$CHANGES"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create beta prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.full }}
          name: v${{ steps.ver.outputs.full }}
          prerelease: true
          body: |
            ## Beta build v${{ steps.ver.outputs.full }}

            Opt-in pre-release. Pull `${{ env.GHCR_IMAGE }}:beta` and enable
            **Include Beta Releases** in Updater settings to track this channel.
            `:latest` users are unaffected.

            ### Changes since ${{ steps.changelog.outputs.last_tag }}
            ${{ steps.changelog.outputs.changes }}
