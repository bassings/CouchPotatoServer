name: Mutation Testing

# Mutation testing is slow, so it runs nightly and on-demand — NOT per-PR.
# Scores are informational; runner and reporting errors fail visibly. Use
# survivor reports to identify behaviour the current tests do not pin down.

on:
  schedule:
    # 03:17 UTC nightly (off-peak; odd minute to avoid the top-of-hour rush).
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      paths:
        # Passed as literal arguments to `mutmut run` below. mutmut 3.x takes MUTANT
        # NAME filters here, not source paths — a bare module path matches
        # nothing, so use a glob like 'couchpotato.core.db.sqlite_adapter*'
        # (same form scripts/mutation_changed.py builds).
        description: 'Mutant-name filter(s), e.g. couchpotato.core.db.sqlite_adapter* (space-separated, optional)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  python-mutation:
    name: Python (mutmut)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run mutmut
        env:
          PYTHONPATH: ${{ github.workspace }}/libs
          # Split into an array without shell evaluation or filename expansion.
          # Dispatch text is data, including glob filters and shell characters.
          MUTMUT_PATHS: ${{ github.event.inputs.paths }}
        run: |
          set -euo pipefail
          mkdir -p reports/mutation/python
          read -r -a mutation_command <<< "mutmut run ${MUTMUT_PATHS:-}"
          "${mutation_command[@]}" 2>&1 | tee reports/mutation/python/run.log

      - name: Generate mutation report
        run: |
          set -euo pipefail
          mutmut results --all true | tee reports/mutation/python/results.txt
          echo '## Python mutation results' >> "$GITHUB_STEP_SUMMARY"
          cat reports/mutation/python/results.txt >> "$GITHUB_STEP_SUMMARY"
          rm -f mutants/mutmut-cicd-stats.json
          mutmut export-cicd-stats
          test -s mutants/mutmut-cicd-stats.json
          cp mutants/mutmut-cicd-stats.json reports/mutation/python/

      - name: Upload mutmut report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutmut-report
          path: reports/mutation/python/
          if-no-files-found: error
          retention-days: 14

  js-mutation:
    name: JS (Stryker)
    runs-on: ubuntu-latest
    # Mutates the extracted UI logic under couchpotato/static/scripts/ui/
    # (see stryker.conf.json). Informational, so a low score never blocks.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Stryker
        run: |
          set -euo pipefail
          mkdir -p reports/mutation
          npm run test:mutation 2>&1 | tee reports/mutation/run.log
          test -s reports/mutation/mutation.json
          test -s reports/mutation/stryker.html

      - name: Upload Stryker report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stryker-report
          path: reports/mutation/
          if-no-files-found: error
          retention-days: 14
