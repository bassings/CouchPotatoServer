name: Claude Review

# Automated agent review on every PR. Authenticated with a Claude subscription
# OAuth token (secret: CLAUDE_CODE_OAUTH_TOKEN) — no Anthropic API billing.
# Generate the token once with `claude setup-token` and add it at:
#   Settings → Secrets and variables → Actions → New repository secret
#
# The review is posted as PR comments. "Remediated before merge" is enforced by
# branch protection (required_conversation_resolution = true): every review
# thread Claude opens must be resolved before the PR can merge.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude-review:
    name: claude-review
    runs-on: ubuntu-latest
    # The fork/Dependabot exclusion lives on the REVIEW STEP below, not on the
    # job, and moving it there was a security fix rather than a tidy-up.
    #
    # A job skipped via a job-level `if:` runs ZERO steps -- an `if: always()`
    # step included. Measured on run 31556193805: conclusion "skipped", steps 0.
    # With the exclusion on the job, the skip-detection step at the bottom of
    # this file could never fire for a fork or Dependabot PR, which is exactly
    # the population that matters most here: `.github/dependabot.yml` watches
    # the `github-actions` ecosystem weekly, so Dependabot will periodically
    # open a PR bumping `anthropics/claude-code-action` -- a PR that EDITS THIS
    # FILE, and therefore one where the reviewer silently does not run. A
    # supply-chain bump to the reviewer itself, merging on a green required
    # check with nobody told.
    #
    # With the gate on the step instead, the job always runs and reports
    # `success`, which satisfies branch protection the same way `skipped` did,
    # and the detection step fires for every pull request.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Claude PR review
        id: review
        # Skip if the secret isn't configured yet, so PRs aren't blocked by a
        # missing token while you finish setup. Also skip for Dependabot:
        # claude-code-action@v1 rejects bot actors by default ("Workflow
        # initiated by non-human actor"), and registering
        # CLAUDE_CODE_OAUTH_TOKEN as a separate Dependabot secret isn't wanted.
        # Moved here from the job's `if:` -- see the note above `steps:`.
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Keep one updating summary comment per PR (visible verdict even when
          # the review is clean — otherwise a clean review looks like a no-op).
          use_sticky_comment: true
          # The GitHub comment MCP tools are NOT in agent mode's default allow
          # list, so without this the agent's posting attempts are denied
          # (permission_denials) and it silently posts nothing. Allow the inline
          # + sticky comment tools, plus gh as a fallback for the summary.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,mcp__github_comment__update_claude_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review the changes in this pull request as a principal engineer for
            CouchPotatoServer (Python 3.14 FastAPI media server; see CLAUDE.md
            and AGENTS.md for project rules).

            WHERE A FINDING GOES DEPENDS ON WHETHER IT MUST CHANGE, and this
            matters more than it looks. `required_conversation_resolution` is
            enabled on master, so EVERY inline review thread is a merge gate,
            including one you label "nit" or "not blocking". A thread costs a
            reply, a resolution and a full re-run of twelve checks.

            - Something that MUST change before merge (correctness, security,
              a test that cannot fail, a broken contract): post it as an inline
              review comment (mcp__github_inline_comment__create_inline_comment)
              at the exact line. Say what breaks and under what input.
            - Everything else (nits, style, praise, "consider", "worth knowing",
              anything you would label low or non-blocking): put it in the
              SUMMARY COMMENT BODY as a short bulleted "Observations" section,
              naming file:line. Do NOT open an inline thread for it.

            If you are unsure which a finding is, ask yourself whether you would
            block the merge over it. If the answer is no, it is an observation.

            OBSERVATIONS MUST SURVIVE A RE-RUN. Write for both cases rather
            than assuming which one you are in, because this repo has been
            wrong about it in both directions.

            MEASURED 2026-08-20: despite `use_sticky_comment: true`, runs on
            #277 and #279 each produced FIVE separate comments with distinct
            ids and `created == updated`. The setting is inert in practice,
            probably because the summary goes out through `gh pr comment`
            rather than the sticky tool. So today, earlier summaries persist.

            - If you are ADDING a new comment (what happens today): do not
              repeat observations an earlier comment already carries and that
              still stand. Say "earlier observations still apply" and list only
              what is new, plus a "resolved since last review" line for any the
              current diff has fixed.
            - If you are UPDATING an existing summary in place: carry forward
              every observation the diff has NOT addressed, because a rewrite
              deletes anything you do not re-emit, and note the resolved ones
              the same way.

            Never drop an observation silently under either shape.

            ONE CARVE-OUT, AND IT IS NOT OPTIONAL: an uncertain SECURITY,
            PRIVACY or DATA-LOSS finding goes INLINE, not into observations.
            Everywhere else, uncertainty downgrades to an observation until you
            can name the failure it causes. Here it does the opposite, because
            the cost is asymmetric: a wrong inline thread costs one reply, and
            a missed credential leak or data-loss path costs the user something
            they cannot get back. Measured on this repo, an inline thread is
            the ONLY content-aware block on master -- there are zero required
            approving reviews, and of twelve required contexts only this one
            reads semantics -- so an observation is advisory and nothing else.
            If you are unsure whether a finding is in this class, treat it as
            though it is.

            If you retract or correct an earlier comment of your own, put the
            correction in the summary body rather than opening a second thread,
            because both threads then have to be resolved by hand.

            Focus on:
            - Correctness and edge cases, especially around the SQLite adapter
              and read-modify-write DB patterns (known race-condition area).
            - Security: auth, input validation, injection, secrets, the Alpine
              Docker image hardening (target 0 CVEs).
            - Test quality: are new behaviours covered by tests to a principal
              developer's standard (clear names, edge cases, failure modes)?
            - Adherence to project rules: ruff-clean, conventional commits, no
              committed secrets/test data, E2E specs updated for UI changes.

            ALWAYS post a brief summary comment with an explicit overall verdict —
            start it with `✅ LGTM` or `⚠️ Changes requested` — even when there
            are no issues, so the review is clearly visible. Follow the verdict
            with the "Observations" section if you have any. Be specific and
            actionable; if the change is safe and complete, say so plainly rather
            than inventing nits.

            A review that blocks on nothing and observes three things is a good
            review, not a lazy one.

      # T63. On a pull request that edits THIS FILE, the reviewer does not run
      # and the required `claude-review` check goes green anyway. Four for four:
      # #129, #132, #149 and #281 each edit this file and each carries zero
      # claude[bot] comments, while every non-Dependabot PR around them has
      # them. All four were themselves changes to the reviewer, so the changes
      # least able to afford going unreviewed are exactly the ones that did.
      #
      # WHAT ACTUALLY SKIPS, corrected after review measured it. GitHub runs the
      # workflow normally; it is `anthropics/claude-code-action` that refuses to
      # act, logging "Skipping action due to workflow validation: the workflow
      # file must exist and have identical content to the version on the
      # repository's default branch". Run 32337224625 on #281 shows every step
      # reporting success with that warning buried in the log. So this guard
      # tracks a THIRD-PARTY ACTION'S self-check, pinned to a floating @v1 tag,
      # not a platform invariant: Anthropic can change the condition, the
      # message or the scope in any release and nothing here would notice.
      # The behavioural tests in tests/unit/test_claude_review_skip_is_visible.py
      # pin our side of it; they cannot pin theirs.
      #
      # TWO WAYS THE REVIEW DOES NOT RUN, and both must be reported, because a
      # reader told to "look for the skip notice" is misled by whichever one is
      # missing:
      #   1. the action's own workflow validation (this file differs from the
      #      default-branch copy)
      #   2. the review step's `if:` gate (fork PR, or Dependabot) -- which is
      #      the population that matters most, since dependabot.yml watches the
      #      github-actions ecosystem weekly and will open PRs bumping the
      #      reviewer action itself
      #
      # This step must NOT fail the job. Failing deadlocks every future edit to
      # this file, because the only way to repair it would be a PR this gate now
      # blocks. A skipped review must be VISIBLE, not BLOCKING. Every path below
      # exits 0, including the ones that cannot determine an answer.
      #
      # Deliberately no nested heredoc in `run:`: heredoc lines land at column 0
      # and silently terminate the YAML block scalar, corrupting the file.
      - name: Report when the review did not actually run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          SELF: .github/workflows/claude-review.yml
        run: |
          set -uo pipefail

          # Every expansion is `${VAR:-}` on purpose. Under `set -u` a genuinely
          # unset variable aborts with exit 1, and exit 1 here deadlocks the
          # workflow. GitHub always sets an `env:`-declared variable, so that is
          # unreachable as written and reachable the moment someone deletes an
          # `env:` line while leaving the shell alone -- which is what a careless
          # edit looks like, and which review demonstrated deadlocking the job
          # while the whole suite stayed green.
          BRANCH="${DEFAULT_BRANCH:-}"
          FILE="${SELF:-.github/workflows/claude-review.yml}"
          PR="${PR_NUMBER:-}"
          OUTCOME="${REVIEW_OUTCOME:-}"
          MARKER="<!-- claude-review-did-not-run -->"

          post () {
            echo "::warning::$1"
            if [ -z "$PR" ]; then
              echo "::warning::no pull request number available, so this log line is the only record."
              return 0
            fi
            # Post ONCE per pull request, not once per push. The reviewer's own
            # summaries already demonstrate the failure mode this avoids: #277
            # and #279 each accumulated five separate comments. Repeating the
            # one notice that must not be ignored is how it gets ignored.
            if gh pr view "$PR" --json comments --jq '.comments[].body' 2>/dev/null | grep -qF "$MARKER"; then
              echo "notice already present on PR $PR; not posting a duplicate."
              return 0
            fi
            if ! gh pr comment "$PR" --body "$2"; then
              echo "::warning::could not post the notice, so this log line is the only record."
            fi
          }

          body () {
            printf '%s\n' \
              "$MARKER" \
              '### :warning: `claude-review` did NOT run on this pull request' \
              '' \
              "$1" \
              '' \
              'The `claude-review` check is REQUIRED, so it reports green regardless.' \
              'Green here does **not** mean the review passed. It means no review' \
              'happened, and without this notice that is indistinguishable from a' \
              'clean one.' \
              '' \
              '**Review this pull request by other means before merging.**'
          }

          if [ "$OUTCOME" = "skipped" ]; then
            post "the review step was skipped by its own condition (fork pull request, or Dependabot), so no review ran." \
                 "$(body 'The review step was skipped by its own condition: this is a fork pull request, or it was opened by Dependabot. Dependabot pull requests that bump `anthropics/claude-code-action` change the reviewer itself, and are the least safe of all to merge unreviewed.')"
            exit 0
          fi

          if [ -z "$BRANCH" ]; then
            echo "::warning::DEFAULT_BRANCH is empty, so whether the review ran is unknown. Treat this check as unproven."
            exit 0
          fi

          if ! git fetch --quiet --depth=1 origin "$BRANCH" 2>/dev/null; then
            echo "::warning::could not fetch origin/$BRANCH, so whether the review ran is unknown. Treat this check as unproven."
            exit 0
          fi

          if git diff --quiet "origin/$BRANCH" -- "$FILE"; then
            echo "$FILE matches origin/$BRANCH and the review step ran, so the review was not skipped."
            exit 0
          fi

          post "the review was SKIPPED by workflow validation because this pull request edits $FILE. The green check does NOT mean the review passed." \
               "$(body "This pull request edits \`$FILE\`. \`anthropics/claude-code-action\` refuses to act when that file differs from the copy on the default branch, so the **reviewer never executed here**.")"
