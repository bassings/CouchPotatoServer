<script>
/* ══════════════════════════════════════════════════════════════════════════

/** Resolve the settings panel that owns a component.
 *
 * Deliberately ancestry-scoped: a detached component must not reach back into
 * whichever settings panel happens to remain in the document.
 */
function getSettingsPanel(element) {
  const panel = element && element.closest('[x-data="settingsPanel()"]');
  return panel ? Alpine.$data(panel) : null;
}

/* ── Logs panel (embedded in Settings) ── */
function logsPanel() {
  return {
    logs: [],
    logLoading: false,
    clearError: '',
    loadError: '',
    clearingLogs: false,
    logEpoch: 0,
    refreshRequestId: 0,
    logType: 'all',
    autoRefresh: true,
    refreshTimer: null,

    async init() {
      await this.refresh();
      if (this.autoRefresh) this.startAutoRefresh();
    },

    async refresh(force = false) {
      if (this.clearingLogs || (this.clearError && !force)) return;
      const epoch = this.logEpoch;
      const requestId = ++this.refreshRequestId;
      const isCurrent = () => epoch === this.logEpoch && requestId === this.refreshRequestId && !this.clearingLogs;
      this.logLoading = true;
      try {
        const typeParam = this.logType !== 'all' ? '&type=' + this.logType : '';
        const resp = await fetch(CP.apiBase + '/logging.partial/?limit=500' + typeParam);
        const data = await resp.json();
        const lines = data?.log ?? data?.lines;
        if (!resp.ok || data?.success !== true || !Array.isArray(lines)) throw new Error('Log load failed');
        if (isCurrent()) {
          this.logs = this.parseLogs(lines);
          this.loadError = '';
          if (force) this.clearError = '';
        }
      } catch {
        // The error is deliberately not logged or shown: a failed load can carry
        // server response text. The visible error state below is the handling.
        if (isCurrent()) {
          this.loadError = 'Unable to load logs. Refresh to retry.';
          console.error('Failed to load logs');
        }
      }
      if (epoch === this.logEpoch && requestId === this.refreshRequestId) {
        this.logLoading = false;
        this.$nextTick(() => {
          const el = document.getElementById('log-container');
          if (el) el.scrollTop = el.scrollHeight;
        });
      }
    },

    parseLogs(lines) {
      return CP.ui.parseLogLines(lines);
    },

    async clearLogs() {
      if (this.clearingLogs) return;
      this.clearingLogs = true;
      this.logEpoch++;
      this.logLoading = false;
      this.clearError = '';
      try {
        const resp = await fetch(CP.apiBase + '/logging.clear/');
        const data = await resp.json();
        if (!resp.ok || !data || data.success !== true) throw new Error('Log clear failed');
        this.logs = [];
        this.loadError = '';
      } catch (e) {
        console.debug('Log clear failed', e?.name);
        this.clearError = 'Unable to clear all logs. Some entries may remain. Refresh to check.';
      } finally {
        this.clearingLogs = false;
      }
    },

    startAutoRefresh() {
      this.stopAutoRefresh();
      this.refreshTimer = setInterval(() => this.refresh(), 10000);
    },

    stopAutoRefresh() {
      if (this.refreshTimer) {
        clearInterval(this.refreshTimer);
        this.refreshTimer = null;
      }
    },

    toggleAutoRefresh() {
      if (this.autoRefresh) this.startAutoRefresh();
      else this.stopAutoRefresh();
    },
  };
}

/** How long the re-read at the end of a button action may take before it counts as failed. */
const REREAD_TIMEOUT_MS = 15000;

/** How long a row removed from a combined field waits before the group is saved, so a
 *  mis-click can be taken back with Undo and nothing has gone to the server (owner
 *  decision, 2026-11-18). The Undo control does NOT end with this window (WCAG 2.2.1):
 *  after the save it re-inserts the row and saves again. Any save that is sent for
 *  another reason (a flush, leaving the page, an edit's own debounce) carries the removal
 *  at once. */
const REMOVAL_UNDO_WINDOW_MS = 8000;

/** How long the saves of a section wait for a save of the same section whose request has
 *  been SENT and not answered, before the next one is sent anyway (SEC-005 C1). The clock
 *  starts when that request is sent, never while it is still queued. The unanswered request
 *  is not aborted: it may still succeed on the server. */
const SAVE_WAIT_DEADLINE_MS = 10000;

/** How a single-option save ended (SEC-005 D7): what `sendSingleSave` resolves to, and what
 *  a section's chain link resolves to once its wait is over. */
const SAVE_LANDED = 'landed';
const SAVE_REFUSED = 'refused';
const SAVE_FAILED = 'failed';
const SAVE_UNANSWERED = 'unanswered';
/** A save of a button's own batch that was not sent because an earlier save of the batch did not land. */
const SAVE_SKIPPED = 'skipped';

/** The result region's text when a button did not run because a value of its own section is not
 *  saved (SEC-005 AC-PROD-12). Fixed apart from the button's own label (shown as text by x-text);
 *  no address, key or value goes into it. */
const ACTION_NOT_RUN_TEXT = {
  refused: (label) => label + ' did not run because a change above did not save. Fix it if needed, then press '
    + label + ' to save and run again.',
  unanswered: (label) => label + ' did not run: your changes have not finished saving. '
    + 'If this happens again, check CouchPotato is still running.',
};

/* ── Settings panel (main) ── */
function settingsPanel() {
  return {
    activeTab: 'general',
    // Tabs that render their own x-data panel (instead of the generic group
    // list). Add new custom-panel tabs here; the generic-panel x-show in
    // settings.html keys off this Set so it never needs another && condition.
    customPanelTabs: ['logs', 'profiles', 'categories'],
    loading: true,
    saving: false,
    showAdvanced: false,
    needsRestart: false,
    restartPending: false,
    testing: null,
    testResult: {},
    testResultDetails: {},
    message: '',
    messageType: 'success',
    openGroups: {},
    options: {},
    values: {},
    dirty: {},
    tabOrder: [],
    currentGroups: [],
    lastSaved: false,
    saveTimers: {},
    pendingSaves: {},
    saveChains: {},
    // section -> the links of its single-option saves that have not settled (see saveSingle),
    // which is what a button asks "did my section's saves land" of (SEC-005 D7).
    openSaves: {},
    // key -> {section, name} for every value typed and not yet accepted by the server. `dirty` holds the
    // values; this says which section and option a key is (a section name could hold a dot), so a button
    // can find its own section's unsaved values (SEC-005 D7). Cleared with `dirty`, in applyAcceptedSave.
    dirtyOpts: {},
    // Combine groups (SEC-004 P3). `combineState` is what the settings read says
    // about each group (`misaligned`, `rows`); the page never derives either.
    // `groupState` holds each group's rows, refusal and in-flight save at PANEL
    // level, so they outlive the field that shows them being rebuilt.
    combineState: {},
    groupState: {},
    version: '',
    updateAvailable: null,
    _watchersRegistered: false,

    // Directory browser state
    browserOpen: false,
    browserPath: '/',
    browserDirs: [],
    browserLoading: false,
    browserError: '',
    browserValid: false,
    browserRequestedPath: '/',
    browserRequestId: 0,
    browserTarget: null,
    browserParent: '/',
    browserIsRoot: true,

    // Hidden/obsolete sections
    hiddenSections: new Set([
      'wdtvlive', 'windowsmediacenter', 'sonyps3', 'mediabrowser',
      'pneumatic', 'homey',
      'awesomehd', 'bithdtv', 'scenetime', 'torrentbytes',
    ]),
    
    advancedSections: new Set([]),
    hiddenTabs: new Set(['providers', 'automation']),
    tabRemaps: { 'automation': 'display' },

    tabLabels: {
      general: 'General',
      profiles: 'Profiles',
      categories: 'Categories',
      downloaders: 'Downloaders',
      searcher: 'Searchers',
      renamer: 'Renamer',
      notifications: 'Notifications',
      manage: 'Library',
      display: 'Suggestions',
      providers: 'Providers',
      logs: 'Logs',
    },

    providerCategories: {
      sabnzbd: { tab: 'downloaders', category: 'usenet', label: 'Usenet Clients', order: 1 },
      nzbget: { tab: 'downloaders', category: 'usenet', label: 'Usenet Clients', order: 1 },
      transmission: { tab: 'downloaders', category: 'torrent', label: 'Torrent Clients', order: 2 },
      qbittorrent: { tab: 'downloaders', category: 'torrent', label: 'Torrent Clients', order: 2 },
      deluge: { tab: 'downloaders', category: 'torrent', label: 'Torrent Clients', order: 2 },
      rtorrent: { tab: 'downloaders', category: 'torrent', label: 'Torrent Clients', order: 2 },
      utorrent: { tab: 'downloaders', category: 'torrent', label: 'Torrent Clients', order: 2 },
      blackhole: { tab: 'downloaders', category: 'other', label: 'Other', order: 3 },
      putio: { tab: 'downloaders', category: 'other', label: 'Other', order: 3 },
      synology: { tab: 'downloaders', category: 'other', label: 'Other', order: 3 },
      binsearch: { tab: 'searcher', category: 'usenet-free', label: 'Usenet — Free', order: 10 },
      newznab: { tab: 'searcher', category: 'usenet-account', label: 'Usenet — Account Required', order: 11 },
      thepiratebay: { tab: 'searcher', category: 'torrent-free', label: 'Torrents — Free', order: 20 },
      yts: { tab: 'searcher', category: 'torrent-free', label: 'Torrents — Free', order: 20 },
      torrentpotato: { tab: 'searcher', category: 'torrent-free', label: 'Torrents — Free', order: 20 },
      iptorrents: { tab: 'searcher', category: 'torrent-account', label: 'Torrents — Account Required', order: 21 },
      passthepopcorn: { tab: 'searcher', category: 'torrent-account', label: 'Torrents — Account Required', order: 21 },
      alpharatio: { tab: 'searcher', category: 'torrent-account', label: 'Torrents — Account Required', order: 21 },
      hdbits: { tab: 'searcher', category: 'torrent-account', label: 'Torrents — Account Required', order: 21 },
      torrentday: { tab: 'searcher', category: 'torrent-account', label: 'Torrents — Account Required', order: 21 },
      torrentleech: { tab: 'searcher', category: 'torrent-account', label: 'Torrents — Account Required', order: 21 },
    },

    combinedBasicsSections: {
      'searcher': { tab: 'searcher', label: 'Basics', order: 1 },
      'nzb': { tab: 'searcher', label: 'NZB', order: 3 },
      'torrent': { tab: 'searcher', label: 'Torrents', order: 4 },
    },
    combinedBasicsGroups: new Set(['searcher', 'filter']),

    // Rich contextual help for settings
    settingHelp: {
      'renamer.from': {
        description: 'The folder where CouchPotato looks for completed downloads.',
        whenToChange: 'Set this to your download client\'s "completed downloads" folder.',
        tip: 'Make sure CouchPotato has read/write access to this folder.',
      },
      'renamer.to': {
        description: 'Your main movie library folder where films are organized.',
        whenToChange: 'Point this to your Plex/Emby/Jellyfin media library.',
        tip: 'Movies will be moved here and renamed according to your rules.',
      },
      'renamer.file_action': {
        description: 'What to do with movie files: move, copy, or create links.',
        whenToChange: '<strong>Move</strong>: Most common.<br><strong>Copy</strong>: Keep original.<br><strong>Link</strong>: Advanced — allows seeding.',
        learnMore: 'Symbolic links create a pointer to the original file. Hard links create a second reference to the same data. Both allow seeding while having organized files.',
      },
      'sabnzbd.host': {
        description: 'The URL where SABnzbd is running.',
        defaultNote: 'Usually http://localhost:8080 for local installs.',
      },
      'sabnzbd.api_key': {
        description: 'API key for authenticating with SABnzbd.',
        whenToChange: 'Find this in SABnzbd → Config → General → API Key.',
      },
    },

    getSettingHelp(section, optName) {
      return this.settingHelp[section + '.' + optName] || null;
    },

    buildDescription(section, opt) {
      // HTML assembly delegated to CP.ui.buildDescription (settings-help.js).
      // Tolerates the no-arg call in field_types.html (opt may be undefined).
      return CP.ui.buildDescription(
        this.getSettingHelp(section, opt && opt.name),
        opt && opt.description
      );
    },

    hasLearnMore(section, optName) {
      const help = this.getSettingHelp(section, optName);
      return help && help.learnMore;
    },

    getLearnMore(section, optName) {
      const help = this.getSettingHelp(section, optName);
      return help ? help.learnMore : '';
    },

    /** Read the settings from the server into the panel. True only for a real answer:
     *  a failed or malformed read changes nothing and says so. */
    async fetchSettings(section = null, signal = undefined) {
      try {
        const resp = await fetch(CP.apiBase + '/settings/', { signal });
        const data = await resp.json();
        if (!resp.ok || !data || typeof data.values !== 'object') return false;
        // A caller that needs one section's rows back (the end of a button action)
        // says which: an answer without it in BOTH places is not a re-read.
        if (section && !(data.values && data.values[section] && data.combine_state && data.combine_state[section])) return false;
        this.options = data.options || {};
        this.values = data.values || {};
        this.combineState = data.combine_state || {};
        return true;
      } catch {
        return false;
      }
    },

    async init() {
      // Register synchronously before the first await. Action buttons can
      // start overlapping refreshes; registering after fetch completion lets
      // both continuations observe an unregistered panel and duplicate these
      // watchers.
      if (!this._watchersRegistered) {
        this.$watch('activeTab', () => this.updateCurrentGroups());
        this.$watch('showAdvanced', () => this.updateCurrentGroups());
        this._watchersRegistered = true;
      }

      try {
        if (!(await this.fetchSettings())) throw new Error('settings read failed');
        this.reloadCleanGroups();

        await this.loadVersionInfo();
        this.computeTabOrder();

        this.computeOpenGroups();
        this.updateCurrentGroups();
      } catch (e) {
        console.error('Failed to load settings', e);
        this.toast('Failed to load settings', 'error');
      }
      this.loading = false;
    },

    async loadVersionInfo() {
      try {
        const vResp = await fetch(CP.apiBase + '/updater.info/');
        const vData = await vResp.json();
        if (vData.version) this.version = vData.version.repr || vData.version.hash?.substring(0,7) || '';
        if (vData.update_version) this.updateAvailable = vData.update_version;
      } catch (e) {
        console.debug('Version info unavailable', e?.name);
      }
    },

    computeTabOrder() {
      const tabSet = new Set();
      for (const [sectionName, section] of Object.entries(this.options)) {
        if (this.hiddenSections.has(sectionName)) continue;
        for (const grp of (section.groups || [])) {
          tabSet.add(grp.tab || 'general');
        }
      }

      const preferred = ['general', 'searcher', 'downloaders', 'renamer', 'notifications', 'automation', 'manage', 'display'];
      this.tabOrder = preferred.filter(t => tabSet.has(t) && !this.hiddenTabs.has(t));
      for (const t of tabSet) {
        if (!this.tabOrder.includes(t) && !this.hiddenTabs.has(t)) this.tabOrder.push(t);
      }
      if (!this.hiddenTabs.has('profiles') && !this.tabOrder.includes('profiles')) this.tabOrder.push('profiles');
      if (!this.hiddenTabs.has('categories') && !this.tabOrder.includes('categories')) this.tabOrder.push('categories');
      if (!this.hiddenTabs.has('logs') && !this.tabOrder.includes('logs')) this.tabOrder.push('logs');
    },

    computeOpenGroups() {
      for (const tab of this.tabOrder) {
        const groups = this.getTabGroups(tab);
        groups.forEach((group, idx) => {
          const key = this.groupKey(group, idx);
          const enabler = this.getEnabler(group);
          if (!enabler || this.isEnabled(group)) this.openGroups[key] = true;
        });
      }
    },

    updateCurrentGroups() {
      this.currentGroups = this.getTabGroups(this.activeTab);
    },

    groupKey(group, idx) {
      return group.section + '.' + (group.name || 'default') + '.' + (idx || 0);
    },

    getTabGroups(tab) {
      const groups = [];
      const combinedGroups = [];

      for (const [sectionName, section] of Object.entries(this.options)) {
        if (this.hiddenSections.has(sectionName)) continue;
        if (this.advancedSections.has(sectionName) && !this.showAdvanced) continue;
        this.appendTabGroups(sectionName, section, tab, groups, combinedGroups);
      }

      groups.sort((a, b) => {
        if (a._categoryOrder !== b._categoryOrder) return a._categoryOrder - b._categoryOrder;
        return a.order - b.order;
      });
      
      if (combinedGroups.length > 0) {
        combinedGroups.sort((a, b) => a.order - b.order);
        return [{
          name: '_combined_basics',
          label: 'Search Settings',
          section: '_combined',
          _isCombined: true,
          _combinedGroups: combinedGroups,
          _categoryOrder: 0,
          order: 0,
        }, ...groups];
      }
      
      return groups;
    },

    appendTabGroups(sectionName, section, tab, groups, combinedGroups) {
      for (const grp of (section.groups || [])) {
        let originalTab = grp.tab || 'general';
        let grpTab = this.tabRemaps[originalTab] || originalTab;
        if (grpTab !== tab) continue;

        const combineInfo = this.combinedBasicsSections[sectionName];
        if (tab === 'searcher' && combineInfo && combineInfo.tab === 'searcher') {
          combinedGroups.push({
            ...grp,
            section: sectionName,
            order: combineInfo.order + (grp.name === 'filter' ? 0.5 : 0),
            _subLabel: grp.label || combineInfo.label,
            _isCombinedPart: true,
          });
          continue;
        }

        const catInfo = this.providerCategories[sectionName];
        groups.push({
          ...grp,
          section: sectionName,
          order: section.order || 999,
          _category: catInfo ? catInfo.category : 'zzz',
          _categoryLabel: catInfo ? catInfo.label : null,
          _categoryOrder: catInfo ? catInfo.order : 99,
        });
      }
    },

    shouldShowCategoryHeader(groupIdx) {
      const group = this.currentGroups[groupIdx];
      if (!group || !group._categoryLabel) return false;
      if (groupIdx === 0) return true;
      return this.currentGroups[groupIdx - 1]._category !== group._category;
    },

    getCategoryLabel(groupIdx) {
      return this.currentGroups[groupIdx]?._categoryLabel || '';
    },

    getGroupOptions(group) {
      const combinedNames = new Set();
      for (const opt of (group.options || [])) {
        if (opt.type === 'combined' && opt.combine) {
          for (const col of opt.combine) {
            if (col !== opt.name) combinedNames.add(col);
          }
        }
      }
      return (group.options || []).filter(opt => !combinedNames.has(opt.name));
    },

    isOptionVisible(opt, group) {
      if (!opt.show_when) return true;
      for (const [key, expected] of Object.entries(opt.show_when)) {
        const [sec, name] = key.split('.');
        const val = this.getVal(sec, name);
        const boolVal = val === true || val === 'True' || val === '1' || val === 1 || val === 'true';
        if (expected === true && !boolVal) return false;
        if (expected === false && boolVal) return false;
        if (typeof expected !== 'boolean' && String(val) !== String(expected)) return false;
      }
      return true;
    },

    getEnabler(group) {
      return (group.options || []).find(o => o.type === 'enabler') || null;
    },

    isEnabled(group) {
      const enabler = this.getEnabler(group);
      if (!enabler) return true;
      // Value coercion delegated to CP.ui.isEnabledValue (settings-values.js).
      return CP.ui.isEnabledValue(this.getVal(group.section, enabler.name));
    },

    toggleEnabler(group) {
      const enabler = this.getEnabler(group);
      if (!enabler) return;
      const newVal = !this.isEnabled(group);
      this.setVal(group.section, enabler.name, newVal);
      const idx = this.currentGroups.indexOf(group);
      if (idx >= 0) this.openGroups[this.groupKey(group, idx)] = newVal;
    },

    getVal(section, name) {
      // Pure resolution delegated to CP.ui.getVal (settings-values.js).
      return CP.ui.getVal({ dirty: this.dirty, values: this.values }, section, name);
    },

    setVal(section, name, value) {
      this.dirty[section + '.' + name] = value;
      this.dirtyOpts[section + '.' + name] = { section, name };
      this.debounceSave(section, name, value);
    },

    debounceSave(section, name, value) {
      const key = section + '.' + name;
      if (this.saveTimers[key]) clearTimeout(this.saveTimers[key]);
      this.pendingSaves[key] = { section, name, value };
      this.saveTimers[key] = setTimeout(() => this.saveSingle(section, name, value), 500);
    },

    /**
     * Run every debounced save NOW and wait for them, each for at most
     * SAVE_WAIT_DEADLINE_MS after it was sent (see saveSingle).
     *
     * For a control that acts on a setting the user has only just typed. The
     * 500ms debounce is right for keystrokes and wrong the moment something
     * READS the saved value: Trakt authorisation asked the server for a
     * device code using whichever credentials the server had before the edit
     * had landed, which on first setup is none of them.
     *
     * The wait is bounded: a save sent and not answered for the deadline stops
     * being waited for, and what follows then runs against what the server still
     * holds (on `master` it waited for ever).
     *
     * Safe to call when nothing is pending: it resolves immediately.
     */
    async flushPendingSaves() {
      const pending = Object.entries(this.pendingSaves);
      this.pendingSaves = {};
      await Promise.all([
        ...pending.map(([key, s]) => {
          if (this.saveTimers[key]) {
            clearTimeout(this.saveTimers[key]);
            delete this.saveTimers[key];
          }
          return this.saveSingle(s.section, s.name, s.value);
        }),
        // A save whose request had already left is no longer in `pendingSaves`, so it
        // is awaited through the section chains (the same bounded wait as the button's).
        ...Object.values(this.saveChains),
        // A combine group is one pending save keyed by the group, not one per
        // column (SEC-004 AC-ARCH-8), so nothing awaiting this can run ahead
        // of an unsaved group.
        this.flushPendingGroups(),
      ]);
    },

    /** The single-option saves of `section` that have been SENT and not settled, as the chain's links.
     *  Taken synchronously by a button, before its first await (SEC-005 D7): a save answered while the
     *  button waits on something else is still part of the press. */
    openSavesOf(section) {
      return [...(this.openSaves[section] || [])];
    },

    /** Every single-option value of `section` the page holds as unsaved, in the order typed: those
     *  accepted by no save yet (`dirty`, which a refused or failed value stays in) and any still on its
     *  debounce timer. A combine row is not one (it is a group, saved as rows). */
    unsavedOf(section) {
      const entries = new Map();
      for (const [key, meta] of Object.entries(this.dirtyOpts)) {
        if (meta.section === section && key in this.dirty) entries.set(key, { key, name: meta.name, value: this.dirty[key] });
      }
      for (const [key, save] of Object.entries(this.pendingSaves)) {
        if (save.section === section) entries.set(key, { key, name: save.name, value: save.value });
      }
      return [...entries.values()];
    },

    /** Whether a button in `section` has anything to wait for: an unsaved single value, a save in
     *  flight, or a group with rows not yet saved. */
    hasUnsavedFor(section) {
      const group = this.groupState[section];
      return this.unsavedOf(section).length > 0 || (this.openSaves[section] || new Set()).size > 0
        || !!(group && (group.timer || group.saving || group.dirty));
    },

    /**
     * Save EVERY unsaved single-option value of ONE section NOW, one at a time in the order typed,
     * wait for them, and say whether they all landed (SEC-005 C1, D7).
     *
     * For a button that acts on the saved settings of its own section: a Sync pressed straight after
     * the Jackett address or key is typed goes out after those saves, and after a save of the section
     * already in flight, not before them. The values sent are the pending ones AND every value the
     * server has not accepted (a refused or failed value stays dirty), so a second press really tries
     * again, and a refusal from before the press blocks the action until the value saves. A value
     * already in flight is awaited, not sent twice. If a save does not land (refused, failed, or
     * unanswered at its wait) the values behind it are NOT sent: a key must not be saved on top of an
     * address that was not, or it would be bound to the old address. They stay unsaved for the next
     * press. Only this section's values are sent. A combine group in another section keeps its
     * 8-second Undo window (a panel wide flush would commit a removed row at once), and a section's
     * own combine group is flushed by `flushGroupFor`.
     *
     * `captured` is the section's open saves as they stood when the button was pressed (see
     * `openSavesOf`); each is awaited and counts.
     *
     * Resolves to 'landed' when every one landed (or there was nothing), 'refused' when one was
     * refused or failed (a refusal is certain, so it wins), 'unanswered' when one was still
     * unanswered when its wait ended. Never rejects.
     */
    async flushPendingSavesFor(section, captured = this.openSavesOf(section)) {
      const entries = this.unsavedOf(section);
      const inFlight = this.openSavesOf(section);
      const sameValue = (link, entry) => link.saveKey === entry.key && String(link.saveValue) === String(entry.value);
      const toSend = entries.filter((entry) => !inFlight.some((link) => sameValue(link, entry)));
      for (const entry of entries) {
        if (this.saveTimers[entry.key]) {
          clearTimeout(this.saveTimers[entry.key]);
          delete this.saveTimers[entry.key];
        }
        delete this.pendingSaves[entry.key];
      }
      // Saves of the section already sent are ahead of these in the chain; if one of them did not
      // land, these are not sent (see above).
      const batch = { stopped: false, ahead: [...new Set([...captured, ...inFlight])] };
      const sent = toSend.map((entry) => this.saveSingle(section, entry.name, entry.value, batch));
      const outcomes = await Promise.all([...batch.ahead, ...sent]);
      if (outcomes.some((outcome) => outcome === SAVE_REFUSED || outcome === SAVE_FAILED)) return 'refused';
      if (outcomes.includes(SAVE_UNANSWERED)) return 'unanswered';
      return outcomes.includes(SAVE_SKIPPED) ? 'refused' : 'landed';
    },

    /* ── Combine groups: one save per group, as rows (SEC-004) ──────────────
       A group is edited as rows but stored as one comma-separated list per
       column. It is saved as ROWS in one request, so the server can refuse a
       cell that would add a position, and no column is ever saved apart from
       its neighbours. Nothing here is written on load, on a tab change or on a
       re-render: only an edit schedules a save. */

    groupMisaligned(section) {
      const state = this.combineState[section];
      return !!(state && state.misaligned);
    },

    groupRowCount(section) {
      const state = this.combineState[section];
      return state && state.rows > 0 ? state.rows : 1;
    },

    declaredDefaultCell(section, col) {
      for (const group of ((this.options[section] || {}).groups || [])) {
        for (const option of (group.options || [])) {
          if (option.name === col && option.default != null) return String(option.default).split(',')[0].trim();
        }
      }
      return '';
    },

    /** What a cell with nothing stored shows, and is saved as. A missing `use`
     *  cell is off (an empty one makes the provider raise); a missing cell of a
     *  pairing column is empty; any other column shows its declared default. */
    missingCell(section, opt, col) {
      if (col === 'use') return '0';
      if ((opt.pairing || opt.combine || []).includes(col)) return '';
      return this.declaredDefaultCell(section, col);
    },

    blankGroupRow(section, opt) {
      return (opt.combine || []).map(col => this.missingCell(section, opt, col));
    },

    /** The rows a stored group shows: the server's row count, each column split
     *  on the comma and trimmed, a column shorter than that supplying its
     *  missing cell. A cell past the row count is not a row and is not shown. */
    deriveGroupRows(section, opt) {
      const columns = opt.combine || [];
      const cells = columns.map(col => String(this.getVal(section, col) ?? '').split(',').map(cell => cell.trim()));
      return Array.from({ length: this.groupRowCount(section) }, (_, index) =>
        columns.map((col, position) => (index < cells[position].length
          ? cells[position][index] : this.missingCell(section, opt, col))));
    },

    /** The panel's one held state for a group, made on first use and kept. */
    ensureGroup(section, opt) {
      if (!this.groupState[section]) {
        this.groupState[section] = {
          opt,
          rows: this.deriveGroupRows(section, opt),
          notice: this.groupMisaligned(section),
          dirty: false,
          version: 0,
          timer: null,
          saving: false,
          queued: false,
          running: null,
          refusal: [],
          refusalKey: '',
          error: '',
          // The rows cannot be edited or saved from the click of a button in this
          // section until the page has the server's rows back. Panel state, keyed
          // by section, so it outlives the button and the field being rebuilt.
          locked: false,
          actionRunning: false,
          reloadError: '',
          stale: false,
          // The one removal Undo can take back: { index, cells, cleanBefore }, or null.
          // Panel state like the rows, so a tab change (which rebuilds the field) keeps it.
          removal: null,
        };
      }
      return this.groupState[section];
    },

    groupIsClean(group) {
      return !group.dirty && !group.saving && !group.timer && !group.queued && !group.error && !group.refusal.length;
    },

    /** After a re-read, a group nobody has edited shows what the server now has.
     *  An edited one keeps the user's rows: a re-read must not drop them. */
    reloadCleanGroups() {
      for (const [section, group] of Object.entries(this.groupState)) {
        // A locked group is always replaceable: it cannot be dirty (it was flushed).
        if (this.groupIsClean(group)) this.replaceGroupRows(section, group);
      }
    },

    replaceGroupRows(section, group) {
      group.rows = this.deriveGroupRows(section, group.opt);
      group.notice = this.groupMisaligned(section);
      // The index and cells of a removal describe the rows that were just replaced.
      group.removal = null;
    },

    /** The group has an unsaved change: save it after `delay` (the usual debounce, or the
     *  undo window for a removal). Any further edit ends the removal Undo could take back:
     *  the rows have moved on from the ones it describes. */
    editGroup(section, delay = 500) {
      const group = this.groupState[section];
      if (group.locked) return;
      group.removal = null;
      group.dirty = true;
      group.version += 1;
      clearTimeout(group.timer);
      group.timer = setTimeout(() => this.saveGroup(section), delay);
    },

    /** Remove row `idx` from the group NOW, and save the rest only after the undo window.
     *  The removal (the index and every cell) is held on the group, so Undo can put it back.
     *  `cleanBefore`: nothing else was unsaved, so an Undo inside the window leaves the
     *  rows exactly as saved and nothing needs sending. */
    removeGroupRow(section, idx) {
      const group = this.groupState[section];
      const cleanBefore = this.groupIsClean(group);
      const taken = CP.ui.takeRow(group.rows, idx);
      group.rows = taken.rows;
      // The marks name rows by position, and the positions have just moved.
      this.shiftRefusal(group, idx);
      this.editGroup(section, REMOVAL_UNDO_WINDOW_MS);
      group.removal = { ...taken.removal, cleanBefore };
      this.announce(CP.ui.rowRemovedAnnouncement(idx), false);
    },

    /** Put the removed row back at its index. Returns that index, or -1 when there is
     *  nothing to undo or the rows are locked. If the removal has not been sent and
     *  nothing else is unsaved, the rows are the saved ones again and the save is
     *  cancelled. Otherwise (it was sent, it failed or was refused, or something else is
     *  unsaved) the rows as they now are, which are rows the user has seen, go through
     *  the normal save. */
    undoGroupRemoval(section) {
      const group = this.groupState[section];
      const removal = group && group.removal;
      if (!removal || group.locked) return -1;
      group.rows = CP.ui.restoreRow(group.rows, removal);
      group.refusal = CP.ui.shiftMarksBack(group.refusal, removal.index)
        .map(entry => ({ ...entry, message: this.refusalText(group, entry) }));
      group.refusalKey = this.refusalKeyOf(group.refusal);
      if (removal.cleanBefore && group.timer && !group.saving) {
        clearTimeout(group.timer);
        group.timer = null;
        group.dirty = false;
      } else {
        this.editGroup(section);
      }
      group.removal = null;
      this.announce(CP.ui.rowRestoredAnnouncement(removal.index), false);
      return removal.index;
    },

    /** The page is going away: a save still waiting out its delay would be lost with it
     *  (the removal, or an edit that rode along), so send it now. `keepalive` lets the
     *  browser finish the request after the page is gone. Nothing waits on the answer. If a
     *  save for the group is already in flight, this one is sent without waiting for it, so
     *  the two may land in either order (a recorded limit: SEC-004 AC-DATA-24(b)). */
    flushGroupsOnLeave() {
      for (const [section, group] of Object.entries(this.groupState)) {
        // Waiting on its timer, or queued behind a save already in flight (the in-flight request
        // may be cut off with the page, so the queued rows go too: see the ordering limit above).
        // `queued` is NOT cleared: if the page survives (a back/forward-cache restore), the in-flight
        // loop then sends the rows on screen LAST, after an older save that answers after this one.
        if (!(group.timer || group.queued) || group.locked) continue;
        clearTimeout(group.timer);
        group.timer = null;
        fetch(CP.apiBase + '/settings.save_group/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ section, rows: this.groupPayloadRows(group) }),
          keepalive: true,
        }).catch(() => { /* the page is closing: there is nobody left to tell */ });
      }
    },

    /** Save now, or queue behind the save already in flight. Resolves to
     *  whether the rows are saved. One request per group is ever open. */
    saveGroup(section, forced = false) {
      const group = this.groupState[section];
      clearTimeout(group.timer);
      group.timer = null;
      // Locked for a button action: nothing is sent, the one exception being the
      // action's own flush of the rows that were already there (`forced`).
      if (group.locked && !forced) return Promise.resolve(false);
      if (group.saving) {
        group.queued = true;
        return group.running;
      }
      group.running = this.runGroupSaves(section, group);
      return group.running;
    },

    async runGroupSaves(section, group) {
      group.saving = true;
      this.saving = true;
      this.lastSaved = false;
      let ok;
      do {
        group.queued = false;
        ok = await this.sendGroup(section, group);
      // Whatever the outcome: a correction typed while a refused save was open
      // is the very edit that can clear the refusal, so it must still be sent.
      } while (group.queued);
      group.saving = false;
      this.saving = Object.values(this.groupState).some(other => other.saving);
      return ok;
    },

    groupPayloadRows(group) {
      const columns = group.opt.combine || [];
      // A `use` cell that is empty is saved as 0, as it is shown (off): an empty
      // one makes the provider's isEnabled raise. Only on an edited group, which
      // is the only kind sent. Other columns, `automation_urls_use` included, are
      // sent as they are.
      return group.rows.map(row => Object.fromEntries(columns.map((col, position) => {
        const cell = String(row[position] ?? '').trim();
        return [col, col === 'use' && cell === '' ? '0' : cell];
      })));
    },

    async sendGroup(section, group) {
      const sent = group.version;
      const rows = this.groupPayloadRows(group);
      try {
        const resp = await fetch(CP.apiBase + '/settings.save_group/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ section, rows }),
        });
        const payload = await this.readSavePayload(resp);
        if (resp.ok && payload && payload.success === true) {
          this.acceptGroup(section, group, rows, sent);
          return true;
        }
        // A verdict on rows the user has since changed says nothing about the
        // rows now on screen (its row numbers may even have moved): the save
        // that follows gives the current one.
        if (group.version === sent) this.rejectGroup(group, payload);
      } catch {
        if (group.version === sent) this.failGroup(group, 'Could not reach the server, so these rows were not saved.');
      }
      return false;
    },

    acceptGroup(section, group, rows, sent) {
      if (!this.values[section]) this.values[section] = {};
      for (const col of (group.opt.combine || [])) this.values[section][col] = rows.map(row => row[col]).join(',');
      group.refusal = [];
      group.refusalKey = '';
      group.error = '';
      group.notice = false;
      // Edits made while this request was open are not saved by it.
      if (group.version !== sent) return;
      group.dirty = false;
      this.lastSaved = true;
      setTimeout(() => { this.lastSaved = false; }, 2000);
    },

    /** Text for one refused cell, composed here from the structured refusal
     *  with this page's row noun and field label. Never the submitted value. */
    refusalText(group, entry) {
      const rules = {
        comma: ' cannot contain a comma. Remove it to save.',
        control_character: ' cannot contain a line break or other control character. Remove it to save.',
        not_encodable: ' contains a character that cannot be saved. Remove it to save.',
      };
      const known = Number.isInteger(entry.row) && entry.row >= 0 && entry.row < group.rows.length
        && (group.opt.combine || []).includes(entry.column) && rules[entry.reason];
      if (!known) return '';
      return 'Row ' + (entry.row + 1) + ': the ' + entry.column.replaceAll('_', ' ') + rules[entry.reason];
    },

    rejectGroup(group, payload) {
      const invalid = payload && Array.isArray(payload.invalid) ? payload.invalid : [];
      const entries = invalid.map(entry => ({ row: entry.row, column: entry.column, reason: entry.reason, message: this.refusalText(group, entry) }));
      if (entries.length && entries.every(entry => entry.message)) {
        this.refuseGroup(group, entries);
        return;
      }
      // The server's own text is the fallback: no structured list, or a reason
      // this page does not know.
      this.failGroup(group, (payload && payload.error) || 'The server did not accept the save.');
    },

    /** One announcement per refusal: a repeat of the same refused cells, which
     *  every further keystroke produces, is not announced again. */
    refuseGroup(group, entries) {
      const key = this.refusalKeyOf(entries);
      group.refusal = entries;
      group.error = '';
      if (key === group.refusalKey) return;
      group.refusalKey = key;
      this.announce(entries.map(entry => entry.message).join(' '), true);
    },

    /** The identity of a refusal: which cells, and why. One definition, so the key a
     *  verdict is compared with and the key a renumbering rebuilds cannot drift apart. */
    refusalKeyOf(entries) {
      return entries.map(entry => entry.row + ':' + entry.column + ':' + entry.reason).join('|');
    },

    failGroup(group, text) {
      group.refusal = [];
      group.refusalKey = '';
      if (text !== group.error) this.announce(text, true);
      group.error = text;
    },

    /** Say something to a screen reader without a visible toast. The region is
     *  cleared first so identical text still mutates it (see `toast`). */
    announce(message, assertive) {
      const region = assertive ? 'assertiveAnnouncement' : 'politeAnnouncement';
      this[region] = '';
      this.$nextTick(() => { this[region] = message; });
    },

    async flushPendingGroups() {
      // A locked group sends nothing here: saveGroup refuses it.
      const pending = Object.entries(this.groupState).filter(([, group]) => group.timer || group.saving);
      await Promise.all(pending.map(([section]) => this.saveGroup(section)));
    },

    /** For a button that acts on the saved settings of its section: save a
     *  group that has unsaved rows first, and say whether it is safe to go on.
     *  A group nobody has touched is already saved. */
    async flushGroupFor(section) {
      const group = this.groupState[section];
      if (!group || !(group.timer || group.saving || group.dirty)) return true;
      return this.saveGroup(section, true);
    },

    /** A button in this section was pressed: lock the group's rows NOW, before any
     *  await, so nothing can be typed while the action's own flush is in flight, nor
     *  while the action runs, nor in the gap before the server's rows are back
     *  (SEC-004 AC-DATA-21, an owner decision of 2026-11-17: "Lock rows during sync").
     *  Returns false when the section has no group, or the lock is already taken. */
    lockGroup(section) {
      const group = this.groupState[section];
      // Refused only while an action is running. A group left locked by a failed
      // re-read is STALE, and pressing the button again takes it back (its end
      // re-reads again), which is the way out without reloading the page.
      if (!group || group.actionRunning) return false;
      group.locked = true;
      group.actionRunning = true;
      group.reloadError = '';
      // Undo is not offered while the rows are locked. The removal itself is not lost:
      // the action's own flush sends it before anything else (flushGroupFor).
      group.removal = null;
      this.announce('These rows are locked while the action runs.', false);
      return true;
    },

    /** The action is over. `mayHaveWritten`: it said it succeeded, or it threw or answered
     *  something that is not JSON, so nobody can know. Then the server's rows are read
     *  NOW and replace the group's, and only then is it unlocked; if that read fails the
     *  group stays locked, because rows that may be stale must never be editable. Only an
     *  action that never ran (its flush was refused) unlocks at once: an action that ran
     *  and answered success false is re-read too, so the section's fields show what the
     *  server holds (SEC-005 C1). */
    async endAction(section, mayHaveWritten) {
      const group = this.groupState[section];
      if (!group) return;
      try {
        // A stale group (an earlier re-read failed) is re-read whatever this action said.
        if (mayHaveWritten || group.stale) {
          if (!(await this.rereadSection(section))) {
            group.stale = true;
            group.reloadError = 'Could not reload these rows. Reload the page before changing them.';
            this.announce(group.reloadError, true);
            return;
          }
          group.stale = false;
          this.replaceGroupRows(section, group);
        }
        group.locked = false;
      } finally {
        group.actionRunning = false;
      }
    },

    /** The re-read at the end of an action: it must answer within a time, and carry the
     *  section in values and combine_state, or it counts as failed. */
    async rereadSection(section) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), REREAD_TIMEOUT_MS);
      try {
        return await this.fetchSettings(section, controller.signal);
      } finally {
        clearTimeout(timer);
      }
    },

    /** Row `idx` was removed: drop its marks and move the later rows' up, so the
     *  marks stay on the rows they describe until the next save gives a verdict. */
    shiftRefusal(group, idx) {
      group.refusal = group.refusal
        .filter(entry => entry.row !== idx)
        .map(entry => (entry.row > idx ? { ...entry, row: entry.row - 1 } : entry))
        .map(entry => ({ ...entry, message: this.refusalText(group, entry) }));
      // The key names rows by position too: left as it was, the server's identical verdict on
      // the renumbered rows would look new and be announced, assertively, a second time.
      group.refusalKey = this.refusalKeyOf(group.refusal);
    },

    /**
     * Save one option, after the save of the same section ahead of it has been
     * answered or has had its wait deadline since it was SENT (SEC-005 C1). Saves of
     * one section go out one at a time in the order they started, so a key is not
     * sent ahead of the address typed before it, and `flushPendingSavesFor` can wait
     * for them. Returns the chain's link for this save: it resolves when the save is
     * answered or its deadline passes, and never rejects (callers may ignore it).
     * A request that never answers delays each save behind it by one deadline and is
     * not aborted: it may still succeed on the server. After a deadline a later save
     * CAN be sent ahead of an earlier one that has not been answered, so a key can
     * then be bound to the address saved before it: the key is only sent to the
     * address the SERVER held when the key was saved, which after a deadline can be
     * the address from before the edit. The chain is dropped once its last link has
     * settled.
     */
    saveSingle(section, name, value, batch) {
      delete this.pendingSaves[section + '.' + name];
      const link = (this.saveChains[section] || Promise.resolve())
        .then(async () => {
          if (batch) {
            // A button's batch stops at the first value that did not land, ahead of it or in it.
            const ahead = await Promise.all(batch.ahead);
            if (batch.stopped || ahead.some((outcome) => outcome !== SAVE_LANDED)) {
              batch.stopped = true;
              return SAVE_SKIPPED;
            }
          }
          const outcome = await this.settledOrDeadline(this.sendSingleSave(section, name, value));
          if (batch && outcome !== SAVE_LANDED) batch.stopped = true;
          return outcome;
        });
      link.saveKey = section + '.' + name;
      link.saveValue = value;
      this.saveChains[section] = link;
      (this.openSaves[section] = this.openSaves[section] || new Set()).add(link);
      link.then(() => {
        if (this.saveChains[section] === link) delete this.saveChains[section];
        this.openSaves[section].delete(link);
        if (this.openSaves[section].size === 0) delete this.openSaves[section];
      });
      return link;
    },

    /** Resolves to how `sent` (a request that has just been sent) ended, or to
     *  SAVE_UNANSWERED after SAVE_WAIT_DEADLINE_MS from now, whichever is first.
     *  Never rejects. */
    settledOrDeadline(sent) {
      return new Promise((resolve) => {
        const timer = setTimeout(() => resolve(SAVE_UNANSWERED), SAVE_WAIT_DEADLINE_MS);
        const done = (outcome) => {
          clearTimeout(timer);
          resolve(outcome);
        };
        sent.then(done, () => done(SAVE_FAILED));
      });
    },

    /** Sends one save. Resolves to SAVE_LANDED, SAVE_REFUSED (the server said no, in
     *  any form) or SAVE_FAILED (the request itself failed); callers that ignore it
     *  behave as before. */
    async sendSingleSave(section, name, value) {
      this.saving = true;
      this.lastSaved = false;
      try {
        const params = new URLSearchParams();
        params.append('section', section);
        params.append('name', name);
        let serialised = String(value);
        if (typeof value === 'boolean') serialised = value ? '1' : '0';
        params.append('value', serialised);
        const resp = await fetch(CP.apiBase + '/settings.save/', {
          method: 'POST',
          body: params
        });

        // The response is READ, not merely awaited. `fetch` rejects only on a
        // network failure -- an HTTP error, or a 200 carrying
        // `{"success": false}`, both resolve normally. So a REFUSED save used
        // to fall straight through to the lines below: the rejected value was
        // written into this.values, the dirty flag was cleared, and
        // `lastSaved = true` drove the role="status" aria-live="polite" region
        // in partials/settings/header.html. The user was told their setting
        // saved, in writing and out loud, when the server had refused it.
        //
        // Newly reachable because of this same PR: settings.save now returns
        // {'success': False} for a directory that resolves outside the soft
        // chroot, where the old code silently let the traversal through. The
        // security fix created a failure response nothing was listening for.
        const payload = await this.readSavePayload(resp);
        if (!resp.ok || (payload && payload.success === false)) {
          const detail = (payload && payload.error) ? payload.error : ('HTTP ' + resp.status);
          this.toast('Could not save ' + this.optionLabel(section, name) + ': ' + detail, 'error');
          this.saving = false;
          return SAVE_REFUSED;   // leave the value dirty and unchanged: it did NOT save
        }

        this.applyAcceptedSave(section, name, payload);
      } catch (e) {
        this.toast('Failed to save ' + this.optionLabel(section, name) + ': ' + e.message, 'error');
        this.saving = false;
        return SAVE_FAILED;
      }
      this.saving = false;
      return SAVE_LANDED;
    },

    /** What the user calls an option: its label, as the field shows it (a screen reader reads a raw
     *  key such as `jackett_api_key` letter by letter), else its name with the underscores taken out. */
    optionLabel(section, name) {
      for (const group of ((this.options[section] || {}).groups || [])) {
        for (const option of (group.options || [])) {
          if (option.name === name && option.label) return option.label;
        }
      }
      return String(name).replace(/_/g, ' ');
    },

    async readSavePayload(resp) {
      try {
        return await resp.json();
      } catch (parseError) {
        return null;  // non-JSON body; fall back to the status code
      }
    },

    applyAcceptedSave(section, name, payload) {
      // Store what the SERVER stored, not what we submitted.
      //
      // A save hook may rewrite the value: `Core.guardAuthRequired` turns a
      // submitted `1` into `0` when no password is set, refusing to create an
      // unrecoverable lockout. The response is `success: true` -- the write
      // genuinely happened -- so the refusal path above does not catch it,
      // and writing `value` here left the "Require login" checkbox ticked,
      // the dirty flag cleared and "Saved" announced, while the server stayed
      // PUBLIC. The UI stated the opposite of the truth about whether
      // authentication was on.
      //
      // NEVER fall back to the submitted value.
      //
      // This used to do `('value' in payload) ? payload.value : value`, which
      // reads as harmless defensiveness and is not: the server deliberately
      // OMITS `value` for a password-typed option, so the fallback substituted
      // the plaintext the operator had just typed -- into `this.values` and,
      // via the toast below, onto the screen. The absence of `value` is a
      // deliberate refusal to disclose, and treating it as a gap to be filled
      // locally defeats it.
      //
      // No `value` means: do not update local state for this field. The last
      // loaded value (already masked by `getValues` for a password) stays,
      // which is exactly right -- there is nothing displayable to replace it
      // with.
      const hasValue = payload && 'value' in payload;

      if (hasValue) {
        if (!this.values[section]) this.values[section] = {};
        this.values[section][name] = payload.value;
      }
      delete this.dirty[section + '.' + name];
      delete this.dirtyOpts[section + '.' + name];

      // Say so when the server did not take what was asked for. Silently
      // showing a different value than the one just typed is how the operator
      // ends up believing a security control is on.
      //
      // Gated on `hasValue` as well as `changed`: the message names the stored
      // value, and the only value available when the server withheld one is
      // the secret the operator just typed.
      if (payload && payload.changed && hasValue) {
        this.toast(
          name.replaceAll('_', ' ') + ' could not be set to that value; the server stored "'
            + payload.value + '" instead. Check the log for the reason.',
          'error', 6000,
        );
        // RETURN. Without it, `lastSaved = true` below fires the green "Saved"
        // tick in header.html and its own role="status" aria-live="polite"
        // region -- so on the one flow this change exists to make truthful,
        // the primary confirmation affordance said the save was accepted.
        // Measured: the real client function returned message='... could not
        // be set ...', messageType='error' AND lastSaved=true together, so a
        // sighted operator glancing at the header sees a tick, and a screen
        // reader delivers "Saved" from the polite queue after the assertive
        // error.
        //
        // The comment a few lines above already closed this for the
        // `success: false` branch; the `changed` branch is new in the same
        // commit and did not inherit it.
        this.saving = false;
        return;
      }

      const restartKeys = ['core.port', 'core.ssl_cert', 'core.ssl_key', 'core.username', 'core.password'];
      if (restartKeys.includes(section + '.' + name)) this.needsRestart = true;

      this.lastSaved = true;
      setTimeout(() => { this.lastSaved = false; }, 2000);
    },

    toggleGroup(key) { this.openGroups[key] = !this.openGroups[key]; },
    isGroupOpen(key) { return !!this.openGroups[key]; },

    async testProvider(group) {
      this.testing = group.section;
      this.testResult[group.section] = '';
      this.testResultDetails[group.section] = null;
      try {
        // The test reads the SAVED rows: send a pending removal (or edit) first, so it
        // tests the rows on screen. A refusal changes nothing here: the test runs on what is saved.
        await this.flushGroupFor(group.section);
        let endpoint;
        if (group.list === 'download_providers') endpoint = 'download.' + group.section + '.test';
        else if (group.list === 'notification_providers') endpoint = 'notify.' + group.section + '.test';
        else if (group.list === 'nzb_providers' || group.list === 'torrent_providers') endpoint = 'provider.' + group.section + '.test';
        else endpoint = group.section + '.test';
        
        const resp = await fetch(CP.apiBase + '/' + endpoint + '/');
        const data = await resp.json();
        const msg = data.message || data.msg || '';
        
        if (!data.success && msg.includes(';')) {
          const details = msg.split(';').map(part => {
            const trimmed = part.trim();
            const colonIdx = trimmed.indexOf(':');
            if (colonIdx > 0) {
              const host = trimmed.substring(0, colonIdx).trim();
              const result = trimmed.substring(colonIdx + 1).trim();
              const success = result.toLowerCase() === 'ok' || result.toLowerCase() === 'connected';
              return { host, success, error: success ? null : result };
            }
            return { host: trimmed, success: false, error: trimmed };
          });
          this.testResultDetails[group.section] = details;
          this.testResult[group.section] = details.filter(d => d.success).length + '/' + details.length + ' passed';
        } else {
          this.testResult[group.section] = data.success ? 'success' : (msg || 'failed');
        }
      } catch (e) {
        console.debug('Provider test failed', e?.name);
        this.testResult[group.section] = 'error';
      }
      this.testing = null;
    },

    async restartApp() {
      if (this.restartPending) return;
      this.restartPending = true;
      const controller = new AbortController();
      const deadline = setTimeout(() => controller.abort(), 10000);
      try {
        const resp = await fetch(CP.apiBase + '/app.restart/', { signal: controller.signal });
        if (!resp.ok || await resp.json() !== 'restarting') throw new Error('Restart not confirmed');
        this.toast('Restarting…', 'success');
        this.needsRestart = false;
        setTimeout(() => location.reload(), 5000);
      } catch (e) {
        console.debug('Restart not confirmed', e?.name);
        this.restartPending = false;
        this.toast('Could not confirm restart. Check server status before retrying.', 'error');
      } finally {
        clearTimeout(deadline);
      }
    },

    // Announcement state, SEPARATE from `message`.
    //
    // The two sr-only regions used to bind straight to `message`, and assigning
    // the SAME string is a no-op under Alpine's reactivity -- so `x-text` never
    // mutated and a repeated message was announced zero times. Measured with a
    // MutationObserver driving the real control: ticking "Require login" twice
    // on a passwordless server gave one mutation on attempt 1 and ZERO on
    // attempt 2, and the checkbox reverts either way, so there was no other
    // signal at all. WCAG 4.1.3.
    //
    // `base.html:214-229` already solves this with clear-then-$nextTick, and
    // accessibility.a11y.spec.ts:687 guards it there. This panel took the
    // persistent-region half of that pattern and left the repeat half behind.
    // Keeping the announcement in its own state means the visible toast does
    // not flicker when the text is cleared to force the mutation.
    politeAnnouncement: '',
    assertiveAnnouncement: '',

    toast(msg, type, duration = 3000) {
      // `duration` is honoured, and the pending timer cancelled.
      //
      // This took a hardcoded 3000 and silently DROPPED any third argument, so
      // the long refusal message added for the auth guard got the same 3s dwell
      // as "Restarting..." -- the opposite of the intent, with no error to say
      // so. The sibling toast() at :837 and the one in base.html both already
      // accept a duration; this one did not, and the call site was modelled on
      // them.
      //
      // clearTimeout for the same reason :837 does it: without it a stale timer
      // from an earlier toast wipes a newer one early.
      clearTimeout(this._settingsToastTimer);
      this.message = msg;
      this.messageType = type;

      // Cleared first, then set on the next tick, so the region MUTATES even
      // when the message is identical to the previous one.
      const region = type === 'error' ? 'assertiveAnnouncement' : 'politeAnnouncement';
      this[region] = '';
      this.$nextTick(() => { this[region] = msg; });

      this._settingsToastTimer = setTimeout(() => this.message = '', duration);
    },

    async browseDirectory(section, name, index = null) {
      this.browserTarget = { section, name, index };
      this.browserOpen = true;
      const currentVal = this.getVal(section, name);
      const startPath = (currentVal && typeof currentVal === 'string' && currentVal.startsWith('/')) ? currentVal : '/';
      this.browserPath = startPath;
      await this.loadDirectories(startPath);
    },

    async loadDirectories(path) {
      const requestId = ++this.browserRequestId;
      this.browserLoading = true;
      this.browserValid = false;
      this.browserError = '';
      this.browserDirs = [];
      this.browserRequestedPath = path;
      try {
        const resp = await fetch(CP.apiBase + '/directory.list/?path=' + encodeURIComponent(path));
        const data = await resp.json();
        if (requestId !== this.browserRequestId) return;
        if (!resp.ok || !data || data.success === false || !Array.isArray(data.dirs)
            || !data.dirs.every(dir => typeof dir === 'string')
            || typeof data.parent !== 'string' || typeof data.is_root !== 'boolean') {
          throw new Error('Invalid directory listing');
        }
        this.browserPath = path;
        this.browserDirs = data.dirs;
        this.browserParent = data.parent;
        this.browserIsRoot = data.is_root;
        this.browserValid = true;
      } catch (e) {
        console.debug('Directory listing failed', e?.name);
        if (requestId !== this.browserRequestId) return;
        this.browserDirs = [];
        this.browserError = 'Unable to list directory';
      } finally {
        if (requestId === this.browserRequestId) this.browserLoading = false;
      }
    },

    goToParentDirectory() {
      if (this.browserIsRoot || this.browserLoading || !this.browserValid) return;
      return this.loadDirectories(this.browserParent);
    },

    selectDirectory(dir) { if (!this.browserLoading && this.browserValid) return this.loadDirectories(dir); },

    confirmDirectory() {
      if (this.browserLoading || !this.browserValid || this.browserError) return;
      const path = this.browserPath;
      if (this.browserTarget) {
        const { section, name, index } = this.browserTarget;
        if (index !== null) {
          window.dispatchEvent(new CustomEvent('directory-selected', { detail: { section, name, index, path } }));
        } else {
          this.setVal(section, name, path);
        }
      }
      this.browserOpen = false;
    },
  };
}

/* ── Button field (action buttons) ── */
function buttonField(section, opt) {
  return {
    running: false,
    // True while the press waits on saves, before the action itself is sent (the button says Saving…).
    waitingOnSaves: false,
    result: '',
    success: false,
    section,
    opt,

    async execute() {
      if (!opt.button_action) {
        this.result = 'No action configured';
        return;
      }
      // The panel is captured NOW: a tab change removes this button's element, after
      // which `getPanel()` finds nothing, and the re-read below must still happen.
      const panel = this.getPanel();
      // Busy is the PANEL's state for the section, so a button rebuilt mid-action is
      // busy too and a second press does nothing.
      if (this.busy) return;
      this.running = true;
      this.result = '';
      // Locked before the first await. False when the section has no combine group.
      const locked = !!panel && panel.lockGroup(this.section);
      // The section's saves in flight, taken now and before the first await (SEC-005 D7): a save
      // answered while the group flush below is awaited is still part of this press.
      const captured = panel ? panel.openSavesOf(this.section) : [];
      this.waitingOnSaves = !!panel && panel.hasUnsavedFor(this.section);
      // Whether the server may have written, for the lock's end: set before the
      // request is sent, so a throw or a non-JSON answer re-reads.
      let mayHaveWritten = false;
      try {
        if (locked && !(await panel.flushGroupFor(this.section))) {
          this.success = false;
          this.result = 'Fix the rows marked in this section first: they could not be saved.';
          return;
        }
        // What the user has just typed in THIS section is saved before the action
        // reads it, and nothing in any other section is sent (SEC-005 C1).
        // A value of this section that did not save stops the press: the action would run on values
        // the server does not hold (SEC-005 D7, AC-PROD-12). Every unsaved value of the section was
        // sent again first, so a second press really tries again. Nothing is re-read: the fields keep
        // what the user typed, for them to check.
        if (panel) {
          const verdict = await panel.flushPendingSavesFor(this.section, captured);
          this.waitingOnSaves = false;
          if (verdict !== 'landed') {
            this.success = false;
            this.result = ACTION_NOT_RUN_TEXT[verdict](this.opt.button_text || 'Execute');
            return;
          }
        }
        // Set before the request is sent and never cleared by its answer: an action
        // that answered success false is re-read as well, so the fields show the
        // saved values (a refused Sync must not leave the page showing an address
        // the server no longer holds).
        mayHaveWritten = true;
        await this.runAction();
      } catch (e) {
        this.success = false;
        this.result = 'Error: ' + e.message;
      } finally {
        // `running` is cleared even if ending the action throws.
        this.waitingOnSaves = false;
        try {
          if (locked) await panel.endAction(this.section, mayHaveWritten);
        } finally {
          this.running = false;
        }
      }
    },

    /** Busy: this button's own action is running, or the panel says the section's
     *  group is locked for one (read from the panel, so it survives a rebuild). */
    get busy() {
      const panel = this.getPanel();
      const group = panel && panel.groupState[this.section];
      return this.running || !!(group && group.actionRunning);
    },

    /** Runs the action and shows its answer. Returns whether the action reported success. */
    async runAction() {
      const resp = await fetch(CP.apiBase + '/' + opt.button_action + '/');
      const data = await resp.json();
      this.success = data.success === true;
      this.result = data.success ? (data.message || 'Success') : (data.error || data.message || 'Failed');
      return data.success === true;
    },

    getPanel() {
      return getSettingsPanel(this.$el);
    },

    buildDescription() {
      const panel = this.getPanel();
      return panel ? panel.buildDescription(this.section, this.opt) : (this.opt.description || '');
    },
  };
}

/* ── Trakt device authorisation (issue #311) ──
   Bespoke, not a generalisation of buttonField above: that helper is
   single-shot (fetch once, show a message, refresh the panel), and this
   flow needs a start call followed by a bounded poll loop with its own
   expiry and a "still waiting" state in between, which buttonField cannot
   express without turning it into something else entirely.

   STRUCTURE, and why it is worth reading before editing this.

   Everything that went wrong with this control was one problem wearing
   different clothes: work continuing across an `await` or a `setTimeout`
   after the thing that started it was gone or superseded. It arrived four
   times, found by four different reviewers, and the fourth was introduced
   while fixing the third:

     - a poll loop outliving the settings tab that started it, so the user
       was told authorisation failed at the moment it succeeded;
     - a request already in flight resuming after teardown and restarting
       the chain teardown had just stopped;
     - a panel refresh timer nothing could cancel;
     - a re-entry flag claimed after an await, so a double click ran two
       flows at once.

   Guarding each one separately meant five pieces of state (`authorising`,
   `polling`, `destroyed`, and two timer handles) each having to be correct
   at six different suspension points. That is about thirty places to get
   right, and a review found a new wrong one every round.

   So there is now ONE invariant instead of five. A "run" is the unit of
   work from a Start click to its terminal state, and exactly one can be
   live. Every continuation asks the same single question -- am I still the
   live run? -- through `isCurrent(run)`, and every timer is created through
   `later(run, ...)`, which will not fire for a run that is over. Cancelling
   a run invalidates its token and drops its timers in one place.

   The practical rule for anyone editing this: after any `await`, the first
   statement must be the `isCurrent(run)` check, and no `setTimeout` should
   appear in this component except through `later()`. Both are mechanical
   and both are visible in review, which the old arrangement was not.

   `authorising` and `polling` survive, but ONLY as display state for the
   button's label and its aria-disabled. They are no longer load-bearing for
   correctness, which is why nothing branches on them after an await. */
function traktDeviceAuth() {
  return {
    // Display state. Read by the template, never trusted for correctness.
    authorising: false,
    polling: false,
    userCode: '',
    verificationUrl: '',
    statusText: '',
    statusClass: 'text-cp-muted',

    // The single correctness invariant. Bumped when a run starts and when
    // one is cancelled, so any continuation holding an older token is, by
    // definition, no longer the live run.
    runId: 0,
    expiresAt: 0,

    /** True while `run` is still the live run. The only question any
     *  continuation in this component needs to ask. */
    isCurrent(run) {
      return run === this.runId;
    },

    /** setTimeout owned by a run: fires only while that run is still live.
     *
     *  Deliberately NOT paired with a timer registry and clearTimeout. An
     *  earlier draft had both, and a mutation showed the second one was
     *  unreachable: cancelling a run cleared its timers, so the check here
     *  could never be the thing that saved you, and no test could tell
     *  whether it worked. Two mechanisms where one is unprovable is the
     *  problem this restructure exists to remove, so there is one.
     *
     *  The cost is a single pending no-op timer per cancelled run, which
     *  fires once, finds its run superseded and does nothing. It does not
     *  reschedule, because the callback it would have called is what
     *  reschedules. */
    later(run, fn, ms) {
      setTimeout(() => {
        if (this.isCurrent(run)) fn();
      }, ms);
    },

    /** End whatever run is live by invalidating its token, so every
     *  continuation and every pending timer belonging to it becomes a no-op
     *  the moment it resumes or fires. */
    cancelRun() {
      this.runId++;
      this.authorising = false;
      this.polling = false;
    },

    async start() {
      // Re-entry guard. The button stays focusable and clickable
      // (aria-disabled, not disabled), so a second click is an ordinary
      // thing for a user to do and must not start a second run.
      if (this.authorising || this.polling) return;

      // Claim the run SYNCHRONOUSLY, before any await, or the guard above is
      // a no-op for the duration of the first suspension.
      this.cancelRun();
      const run = this.runId;
      this.authorising = true;
      this.userCode = '';
      this.verificationUrl = '';
      // Announce the busy state rather than clearing the region. The button's
      // label also changes, but that is only read if focus happens to be on
      // it. The window is not trivial: the server allows a 30s timeout
      // against Trakt, so this can be seconds. (WCAG 4.1.3)
      this.statusText = 'Contacting Trakt…';
      this.statusClass = 'text-cp-muted';

      // Credentials are written through setVal(), which debounces the save by
      // 500ms. Clicking Start straight after typing a Client ID or Secret,
      // which is what someone setting this up does, would otherwise ask Trakt
      // for a code using whatever the server held BEFORE the edit: reported
      // as missing while visibly on screen, or worse, a code issued for the
      // old client and polled for with the new one. That wait is bounded: a
      // save sent and not answered for SAVE_WAIT_DEADLINE_MS is no longer waited
      // for, and the code is then asked for against what the server still holds.
      const panel = this.getPanel();
      if (panel && typeof panel.flushPendingSaves === 'function') {
        await panel.flushPendingSaves();
        if (!this.isCurrent(run)) return;
      }

      try {
        const resp = await fetch(CP.apiBase + '/automation.trakt.device_code/');
        const data = await resp.json();
        if (!this.isCurrent(run)) return;

        if (data.success) {
          this.userCode = data.user_code || '';
          this.verificationUrl = data.verification_url || '';
          this.expiresAt = Date.now() + (Number(data.expires_in) || 600) * 1000;
          this.statusText = 'Waiting for authorisation…';
          this.statusClass = 'text-cp-muted';
          this.authorising = false;
          this.polling = true;
          // Wait the interval before the FIRST poll too. Trakt's interval is
          // the minimum gap between token requests, and the user cannot have
          // typed a code that appeared a moment ago, so an immediate poll is
          // guaranteed to be wasted. Worse than wasted: it can draw the 429
          // slow-down, which doubles the interval for every later poll.
          const first = Number(data.interval) || 5;
          this.later(run, () => this.poll(run, first), first * 1000);
          return;
        }

        this.finish(run, data.error || 'Failed to start authorisation.', false);
      } catch (e) {
        if (!this.isCurrent(run)) return;
        this.finish(run, 'Request failed: ' + e.message, false);
      }
    },

    async poll(run, intervalSeconds) {
      if (!this.isCurrent(run)) return;

      if (Date.now() > this.expiresAt) {
        this.finish(run, 'Authorisation code expired. Please start again.', false);
        return;
      }

      try {
        const resp = await fetch(CP.apiBase + '/automation.trakt.poll_token/');
        const data = await resp.json();
        if (!this.isCurrent(run)) return;

        if (data.success) {
          this.finish(run, data.message || 'Authorisation successful.', true);
          return;
        }

        if (data.pending) {
          const next = Number(data.interval) || intervalSeconds;
          this.later(run, () => this.poll(run, next), next * 1000);
          return;
        }

        // Any non-pending, non-success response is terminal (expired,
        // invalid code, denied, unexpected status): stop and report it.
        this.finish(run, data.error || 'Authorisation failed.', false);
      } catch (e) {
        if (!this.isCurrent(run)) return;
        this.finish(run, 'Request failed: ' + e.message, false);
      }
    },

    /** The one terminal path, success or failure. Ends the run first, so no
     *  timer or in-flight request from it can act afterwards, then paints
     *  the outcome. */
    finish(run, message, ok) {
      if (!this.isCurrent(run)) return;

      this.cancelRun();
      const ended = this.runId;

      this.userCode = '';
      this.verificationUrl = '';
      this.statusText = message;
      this.statusClass = ok ? 'text-cp-success' : 'text-cp-danger';

      if (!ok) return;

      // Same re-init as buttonField.execute(), so the now populated token
      // fields (password inputs rendered from `values`) reflect what the
      // server actually stored. Scheduled through later() like everything
      // else, so teardown cancels it: this timer used to be invisible to
      // cancellation and fired on a torn-down component.
      const panel = this.getPanel();
      if (panel) this.later(ended, () => panel.init(), 500);
    },

    // Alpine 3 calls destroy() when the element is removed, e.g. switching
    // settings tabs, which re-keys currentGroups' x-for and drops this group
    // out of it. Cancelling the run is the whole teardown: it invalidates
    // the token every continuation checks and drops every timer the run
    // owns, so there is nothing left to enumerate and nothing to forget.
    destroy() {
      this.cancelRun();
    },

    getPanel() {
      return getSettingsPanel(this.$el);
    },
  };
}

/* ── Combined field (multi-row entries) ── */
function combinedField(section, opt) {
  return {
    // The group's rows, refusal and in-flight save live on the settings PANEL
    // (`ensureGroup`), not here: this component is rebuilt on every tab change.
    // Named `held`, not `group`: the settings group the template is rendered in
    // is already `group` there.
    held: null,
    // Where focus goes after the render that follows a removal (see removeRow).
    focusTarget: null,
    fieldRoot: null,
    section,
    opt,

    init() {
      this.held = this.getPanel().ensureGroup(section, opt);
      this.fieldRoot = this.$el;
    },

    get rows() { return this.held ? this.held.rows : []; },

    /** The refusal entry for a cell, or undefined. */
    cellError(rowIdx, colIdx) {
      const column = (this.opt.combine || [])[colIdx];
      return this.held ? this.held.refusal.find(entry => entry.row === rowIdx && entry.column === column) : undefined;
    },

    rowErrors(rowIdx) {
      return this.held ? this.held.refusal.filter(entry => entry.row === rowIdx) : [];
    },

    errorId(entry) {
      return 'cf-err-' + this.section + '-' + entry.row + '-' + entry.column;
    },

    noticeId() { return 'cf-notice-' + this.section; },

    /** What describes a cell: the misaligned notice while it is shown, then its
     *  own refusal. Null when neither, so the attribute is absent. */
    describedBy(rowIdx, colIdx) {
      const ids = [];
      if (this.held && this.held.notice) ids.push(this.noticeId());
      const entry = this.cellError(rowIdx, colIdx);
      if (entry) ids.push(this.errorId(entry));
      return ids.length ? ids.join(' ') : null;
    },

    getPanel() {
      return getSettingsPanel(this.$el);
    },
    
    buildDescription() {
