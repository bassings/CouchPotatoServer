{# Field Types - All form field templates for settings #}
{# Requires Alpine context: group, opt, showAdvanced, getVal(), setVal(), buildDescription(), hasLearnMore(), getLearnMore() #}

<!-- Bool / checkbox -->
<template x-if="opt.type === 'bool'">
  <div>
    <label class="flex items-center gap-2 cursor-pointer">
      <input type="checkbox"
             :checked="getVal(group.section, opt.name)"
             @change="setVal(group.section, opt.name, $event.target.checked)"
             :aria-label="opt.label || opt.name.replace(/_/g, ' ')"
             class="rounded border-white/[0.1] bg-white/[0.03] text-cp-accent focus:ring-cp-accent/30">
      <span class="text-[11px] text-cp-muted" x-html="buildDescription(group.section, opt)"></span>
    </label>
    <template x-if="hasLearnMore(group.section, opt.name)">
      <details class="mt-2 text-[10px]">
        <summary class="text-cp-accent cursor-pointer hover:underline">Learn more</summary>
        <div class="mt-1.5 p-2 rounded bg-white/[0.02] border border-white/[0.04] text-cp-muted leading-relaxed" x-html="getLearnMore(group.section, opt.name)"></div>
      </details>
    </template>
  </div>
</template>

<!-- Dropdown / select -->
<template x-if="opt.type === 'dropdown'">
  <div>
    <select @change="setVal(group.section, opt.name, $event.target.value)"
            :aria-label="opt.label || opt.name.replace(/_/g, ' ')"
            class="w-full bg-white/[0.03] border border-white/[0.06] rounded-md px-3 py-2 text-xs focus:outline-none focus:border-cp-accent/30">
      <template x-for="v in (opt.values || [])" :key="JSON.stringify(v)">
        <option :value="Array.isArray(v) ? v[1] : v"
                :selected="String(getVal(group.section, opt.name)) === String(Array.isArray(v) ? v[1] : v)"
                x-text="Array.isArray(v) ? v[0] : v"></option>
      </template>
    </select>
    <p class="text-[10px] text-cp-muted mt-1.5 leading-relaxed" x-html="buildDescription(group.section, opt)"></p>
    <template x-if="hasLearnMore(group.section, opt.name)">
      <details class="mt-2 text-[10px]">
        <summary class="text-cp-accent cursor-pointer hover:underline">Learn more</summary>
        <div class="mt-1.5 p-2 rounded bg-white/[0.02] border border-white/[0.04] text-cp-muted leading-relaxed" x-html="getLearnMore(group.section, opt.name)"></div>
      </details>
    </template>
  </div>
</template>

<!-- Password -->
<template x-if="opt.type === 'password'">
  <div>
    {#- `@change`, NOT `@input`, and only on this field.
        Every other field autosaves per keystroke on a 500ms debounce, which is
        fine when an intermediate value is harmlessly overwritten by the next
        one. Since D6 made a password save ROTATE the session secret, a pause
        longer than that debounce stores `hash_password(md5(<partial value>))`
        as the real password AND signs the operator out of every device --
        including the tab they are still typing in. They cannot then log back
        in with the password they thought they were setting.
        `@change` fires on blur/commit, so no half-typed value is ever
        persisted. -#}
    {#- Render password fields EMPTY, with the state in the placeholder.
        Never bind the mask into the value.

        Three problems disappear at once rather than being patched:

        1. PARTIAL EDIT. With the mask as the value, clicking in puts the
           cursor after it, so pasting stores `********xoxb-NEW` -- old
           credential destroyed, new one corrupt, UI reporting success. With
           nothing in the field there is nothing to append to.
        2. THE MASK BEING SAVED BACK AT ALL. `Settings.saveView` still guards
           against it for the API path, but the browser can no longer submit a
           mask it was never given.
        3. LENGTH DISCLOSURE. `getValues` masks as `len(value) * '*'`, so
           rendering it told anyone looking at the screen exactly how long the
           credential is.

        This replaces an earlier `@focus="$event.target.value = ''"`, which
        worked but wiped the field the instant focus landed -- including via
        Tab. A screen reader would announce "twenty asterisks" and then be
        looking at an empty field with no announcement of the change. Review
        raised it as an accessibility nit; it is better read as a sign the
        mask should never have been in the DOM.

        The placeholder now carries the state a sighted user got from the
        asterisks, and carries it to assistive tech too, which the mask never
        did: it says whether something is stored, not how long it is. -#}
    <input type="password"
           value=""
           :placeholder="getVal(group.section, opt.name) ? 'Saved \u2014 type to replace' : 'Not set'"
           @change="setVal(group.section, opt.name, $event.target.value)"
           :aria-label="opt.label || opt.name.replace(/_/g, ' ')"
           class="w-full bg-white/[0.03] border border-white/[0.06] rounded-md px-3 py-2 text-xs focus:outline-none focus:border-cp-accent/30">
    <p class="text-[10px] text-cp-muted mt-1.5 leading-relaxed" x-html="buildDescription(group.section, opt)"></p>
    <template x-if="hasLearnMore(group.section, opt.name)">
      <details class="mt-2 text-[10px]">
        <summary class="text-cp-accent cursor-pointer hover:underline">Learn more</summary>
        <div class="mt-1.5 p-2 rounded bg-white/[0.02] border border-white/[0.04] text-cp-muted leading-relaxed" x-html="getLearnMore(group.section, opt.name)"></div>
      </details>
    </template>
  </div>
</template>

<!-- Int / Float (number) -->
<template x-if="opt.type === 'int' || opt.type === 'float'">
  <div>
    <input type="number" 
           :step="opt.type === 'float' ? '0.1' : '1'"
           :value="getVal(group.section, opt.name)"
           @input="setVal(group.section, opt.name, $event.target.value)"
           :aria-label="opt.label || opt.name.replace(/_/g, ' ')"
           class="w-full bg-white/[0.03] border border-white/[0.06] rounded-md px-3 py-2 text-xs focus:outline-none focus:border-cp-accent/30">
    <p class="text-[10px] text-cp-muted mt-1.5 leading-relaxed" x-html="buildDescription(group.section, opt)"></p>
    <template x-if="hasLearnMore(group.section, opt.name)">
      <details class="mt-2 text-[10px]">
        <summary class="text-cp-accent cursor-pointer hover:underline">Learn more</summary>
        <div class="mt-1.5 p-2 rounded bg-white/[0.02] border border-white/[0.04] text-cp-muted leading-relaxed" x-html="getLearnMore(group.section, opt.name)"></div>
      </details>
    </template>
  </div>
</template>

<!-- Text (default / string) -->
<template x-if="!opt.type || opt.type === 'string'">
  <div>
    <input type="text"
           :value="getVal(group.section, opt.name)"
           @input="setVal(group.section, opt.name, $event.target.value)"
           :placeholder="opt.placeholder || (opt.default != null ? String(opt.default) : '')"
           :aria-label="opt.label || opt.name.replace(/_/g, ' ')"
           class="w-full bg-white/[0.03] border border-white/[0.06] rounded-md px-3 py-2 text-xs focus:outline-none focus:border-cp-accent/30">
    <p class="text-[10px] text-cp-muted mt-1.5 leading-relaxed" x-html="buildDescription(group.section, opt)"></p>
    <template x-if="hasLearnMore(group.section, opt.name)">
      <details class="mt-2 text-[10px]">
        <summary class="text-cp-accent cursor-pointer hover:underline">Learn more</summary>
        <div class="mt-1.5 p-2 rounded bg-white/[0.02] border border-white/[0.04] text-cp-muted leading-relaxed" x-html="getLearnMore(group.section, opt.name)"></div>
      </details>
    </template>
  </div>
</template>

<!-- Button (action button like Jackett sync) -->
<template x-if="opt.type === 'button'">
  <div x-data="buttonField(group.section, opt)">
    {#- aria-disabled, not disabled: the button holds focus while the action runs, and the
        busy state is the PANEL's for the section, so a button rebuilt by a tab change
        mid-action is still busy. execute() ignores a press while busy. -#}
    <button @click="execute()"
            type="button"
            :aria-disabled="busy ? 'true' : null"
            :class="busy ? 'cursor-not-allowed' : ''"
            :aria-label="(busy ? 'Running… ' : '') + (opt.button_text || opt.label || 'Execute')"
            class="px-4 py-2 rounded-md text-xs font-medium bg-cp-accent/20 text-cp-accent hover:underline transition-colors">
      <span x-show="!busy" x-text="opt.button_text || 'Execute'"></span>
      <span x-show="busy" class="flex items-center gap-2">
        <svg aria-hidden="true" class="w-3 h-3 animate-spin" viewBox="0 0 24 24" fill="none">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
        </svg>
        Running…
      </span>
    </button>
    <div x-show="result" class="mt-2 text-xs" :class="success ? 'text-cp-success' : 'text-cp-danger'" x-text="result" role="status"></div>
    <p class="text-[10px] text-cp-muted mt-1.5 leading-relaxed" x-html="buildDescription()"></p>
  </div>
</template>

<!-- Directory (single path with browse) -->
<template x-if="opt.type === 'directory'">
  <div>
    <div class="flex gap-2">
      <input type="text"
             :value="getVal(group.section, opt.name)"
             @input="setVal(group.section, opt.name, $event.target.value)"
             :placeholder="opt.default != null ? String(opt.default) : '/path/to/folder'"
             :aria-label="opt.label || opt.name.replace(/_/g, ' ')"
             class="flex-1 bg-white/[0.03] border border-white/[0.06] rounded-md px-3 py-2 text-xs focus:outline-none focus:border-cp-accent/30">
      <button @click="browseDirectory(group.section, opt.name)" 
              type="button"
              :aria-label="'Browse for ' + (opt.label || opt.name.replace(/_/g, ' '))"
              class="px-3 py-2 rounded-md text-xs bg-white/[0.04] text-cp-muted hover:text-cp-text hover:bg-white/[0.06] transition-colors shrink-0">
        Browse
      </button>
    </div>
    <p class="text-[10px] text-cp-muted mt-1.5 leading-relaxed" x-html="buildDescription(group.section, opt)"></p>
    <template x-if="hasLearnMore(group.section, opt.name)">
      <details class="mt-2 text-[10px]">
        <summary class="text-cp-accent cursor-pointer hover:underline">Learn more</summary>
        <div class="mt-1.5 p-2 rounded bg-white/[0.02] border border-white/[0.04] text-cp-muted leading-relaxed" x-html="getLearnMore(group.section, opt.name)"></div>
      </details>
    </template>
  </div>
</template>

<!-- Directories (multi-path) -->
<template x-if="opt.type === 'directories'">
  <div class="sm:col-span-2" x-data="directoriesField(group.section, opt)">
    <template x-for="(dir, dirIdx) in dirs" :key="dirIdx">
      <div class="flex gap-2 mb-2 items-center">
        <input type="text" 
               :value="dir"
               @input="updateDir(dirIdx, $event.target.value)"
               placeholder="/path/to/movies"
               :aria-label="(opt.label || opt.name) + ' path ' + (dirIdx + 1)"
               class="flex-1 bg-white/[0.03] border border-white/[0.06] rounded-md px-3 py-1.5 text-xs focus:outline-none focus:border-cp-accent/30">
        <button @click="browseDir(dirIdx)" 
                type="button"
                :aria-label="'Browse for folder ' + (dirIdx + 1)"
                class="px-2 py-1.5 rounded-md text-xs bg-white/[0.04] text-cp-muted hover:text-cp-text hover:bg-white/[0.06] transition-colors shrink-0">
          Browse
        </button>
        <button @click="removeDir(dirIdx)" 
                class="text-cp-muted hover:text-cp-danger transition-colors shrink-0" 
                :aria-label="'Remove folder ' + (dirIdx + 1)">
          <svg aria-hidden="true" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
    </template>
    <button @click="addDir()"
            class="text-[11px] text-cp-accent hover:text-cp-accentHover transition-colors">+ Add folder</button>
    <p x-show="buildDescription()" class="text-[10px] text-cp-muted mt-1.5 leading-relaxed" x-html="buildDescription()"></p>
    <template x-if="hasLearnMore()">
      <details class="mt-2 text-[10px]">
        <summary class="text-cp-accent cursor-pointer hover:underline">Learn more</summary>
        <div class="mt-1.5 p-2 rounded bg-white/[0.02] border border-white/[0.04] text-cp-muted leading-relaxed" x-html="getLearnMore()"></div>
      </details>
    </template>
  </div>
</template>

<!-- Combined (multi-entry rows like newznab hosts/keys) -->
<template x-if="opt.type === 'combined'">
  <div x-data="combinedField(group.section, opt)" :aria-busy="running ? 'true' : null">
    <!-- Misaligned stored rows (the server's flag): persistent until a save of
         this group succeeds. Not a live region: it is there on load, and says
         what is true of the rows now on screen.

         The message boxes below use the validation box of profiles.html WITHOUT its
         bg-cp-danger/10 tint: with it, text-cp-danger measures 4.47:1 on the dark
         card (WCAG 1.4.3 needs 4.5:1, measured by settings-combined.a11y.spec.ts);
         without it, 4.81:1. The border and the text still carry the danger colour. -->
    <template x-if="held && held.notice">
      <div class="mb-2 px-3 py-2 rounded-lg border border-cp-danger/20" :id="noticeId()" data-testid="combine-misaligned-notice">
        <p class="text-xs text-cp-danger">The saved entries here do not line up: some columns have more entries than others. The rows shown are what will be saved when you change one, so check each row first.</p>
      </div>
    </template>

    <!-- A save that failed for any reason other than a refused cell (the route
         is missing, the server answered an error, the network failed). The
         rows stay on screen and unsaved. Announced once by the panel, so this
         carries no live role of its own. -->
    <template x-if="held && held.error">
      <div class="mb-2 px-3 py-2 rounded-lg border border-cp-danger/20" data-testid="combine-save-error">
        <p class="text-xs text-cp-danger" x-text="held.error"></p>
      </div>
    </template>

    <!-- Locked from the click of a button in this section until the server's rows are
         back. Static text; the panel announces the lock once, politely. -->
    <template x-if="locked && !held.reloadError">
      <p class="mb-2 text-xs text-cp-muted" data-testid="combine-locked-note">These rows are locked while the action runs.</p>
    </template>
    <!-- The re-read after the action failed: stays locked, because the rows may be stale. -->
    <template x-if="held && held.reloadError">
      <div class="mb-2 px-3 py-2 rounded-lg border border-cp-danger/20" data-testid="combine-reload-error">
        <p class="text-xs text-cp-danger" x-text="held.reloadError"></p>
      </div>
    </template>

    <!-- Column headers -->
    <div class="flex gap-2 mb-2 items-center text-[10px] text-cp-muted font-medium" aria-hidden="true" data-testid="combine-headers">
      <template x-for="(col, colIdx) in opt.combine" :key="'hdr-'+colIdx">
        <span :class="col === 'use' ? 'w-10 shrink-0 text-center' : (col === 'host' ? 'flex-[2] min-w-0' : 'flex-1 min-w-0')"
              x-text="col === 'use' ? '' : col.replace(/_/g, ' ')"></span>
      </template>
      <span class="w-4 shrink-0"></span>
    </div>

    <!-- Data rows -->
    <template x-for="(row, rowIdx) in rows" :key="rowIdx">
      <div class="mb-2">
      <div class="flex gap-2 items-center" data-testid="combine-row-cells">
        <template x-for="(col, colIdx) in opt.combine" :key="colIdx">
          <div :class="col === 'use' ? 'w-10 shrink-0 flex justify-center' : (col === 'host' ? 'flex-[2] min-w-0' : 'flex-1 min-w-0')">
            <!-- Toggle for 'use' column -->
            <template x-if="col === 'use'">
              <button @click="updateRow(rowIdx, colIdx, (row[colIdx] === '1' || row[colIdx] === 1) ? '0' : '1')"
                      :class="(row[colIdx] === '1' || row[colIdx] === 1) ? 'bg-cp-accent' : 'bg-white/[0.08]'"
                      class="relative w-8 h-4 rounded-full transition-colors shrink-0"
                      role="switch"
                      :aria-checked="(row[colIdx] === '1' || row[colIdx] === 1).toString()"
                      :aria-label="'Enable row ' + (rowIdx + 1)"
                      :aria-disabled="locked ? 'true' : null"
                      :aria-describedby="describedBy(rowIdx, colIdx)">
                <span :class="(row[colIdx] === '1' || row[colIdx] === 1) ? 'translate-x-4' : 'translate-x-0.5'"
                      class="block w-3 h-3 bg-white rounded-full transition-transform absolute top-0.5" aria-hidden="true"></span>
              </button>
            </template>
            <!-- Text input for other columns. A refused cell is marked by
                 aria-invalid, by its danger border AND by the text below the
                 row that aria-describedby points at: never by colour alone. -->
            <template x-if="col !== 'use'">
              <input type="text"
                     :placeholder="col.replace(/_/g, ' ')"
                     :value="row[colIdx] || ''"
                     @input="updateRow(rowIdx, colIdx, $event.target.value)"
                     :aria-label="col.replace(/_/g, ' ') + ' for row ' + (rowIdx + 1)"
                     :readonly="locked"
                     :aria-invalid="cellError(rowIdx, colIdx) ? 'true' : null"
                     :aria-describedby="describedBy(rowIdx, colIdx)"
                     :class="cellError(rowIdx, colIdx) ? 'border-cp-danger focus:border-cp-danger' : 'border-white/[0.06] focus:border-cp-accent/30'"
                     class="w-full bg-white/[0.03] border rounded-md px-3 py-1.5 text-xs focus:outline-none">
            </template>
          </div>
        </template>
        <!-- Not drawn for the last row: it cannot be removed, so a control for it would do nothing
             (the wizard does the same). The spacer keeps the row's cells under the column headers. -->
        <template x-if="canRemove">
          <button @click="removeRow(rowIdx)"
                  @keydown="ignoreHeldKey($event)"
                  type="button"
                  :data-row-remove="rowIdx"
                  :class="locked ? 'cursor-not-allowed' : ''"
                  class="text-cp-muted hover:text-cp-danger transition-colors shrink-0"
                  :aria-label="'Remove row ' + (rowIdx + 1)"
                  :aria-disabled="locked ? 'true' : null"
                  :aria-describedby="held && held.notice ? noticeId() : null">
            <svg aria-hidden="true" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </template>
        <template x-if="!canRemove">
          <span class="w-4 shrink-0" aria-hidden="true"></span>
        </template>
      </div>
      <!-- Refused cells of THIS row, directly below it. Persistent: removed only
           when the group saves. No live role: the panel announces the refusal. -->
      <template x-if="rowErrors(rowIdx).length">
        <div class="mt-1 px-3 py-2 rounded-lg border border-cp-danger/20" data-testid="combine-row-error">
          <template x-for="entry in rowErrors(rowIdx)" :key="entry.column">
            <p class="text-xs text-cp-danger" :id="errorId(entry)" x-text="entry.message"></p>
          </template>
        </div>
      </template>
      <!-- The way back from a removal, in the list at the place the removed row was: directly below
           the row that now sits there (the last row, when the last one was removed), so Undo is the
           very next Tab stop after that row's Remove button, which is where focus lands. It is a
           sibling of the row's own controls inside the row's wrapper, so the keyed rows and the
           inputs in them are not touched when it comes or goes. It stays after the delayed save has
           landed (WCAG 2.2.1): it goes only when the group is edited, added to, removed from again,
           locked, reloaded or the page is. Not a live region: the panel announces the removal once,
           politely. Names the row by number only, never by a value. The lock removes it, so Undo
           is never shown locked. -->
      <template x-if="removedAfter === rowIdx">
        <p class="mt-1 flex flex-wrap items-center gap-x-2 text-xs text-cp-muted" data-testid="combine-removed-line">
          <span :id="'cf-removed-' + section" x-text="removedLine"></span>
          <button @click="undoRemoval()"
                  @keydown="ignoreHeldKey($event)"
                  type="button"
                  data-row-undo
                  :aria-describedby="'cf-removed-' + section"
                  class="inline-flex items-center justify-center min-h-[44px] min-w-[44px] px-2 rounded-md text-cp-accent underline hover:text-cp-accentHover transition-colors">Undo</button>
        </p>
      </template>
      </div>
    </template>

    <button @click="addRow()"
            @keydown="ignoreHeldKey($event)"
            type="button"
            data-row-add
            :aria-disabled="locked ? 'true' : null"
            :class="locked ? 'cursor-not-allowed' : ''"
            class="text-[11px] text-cp-accent hover:text-cp-accentHover transition-colors"
            aria-label="Add row">+ Add</button>
    <p x-show="buildDescription()" class="text-[10px] text-cp-muted mt-1.5 leading-relaxed" x-html="buildDescription()"></p>
    <template x-if="hasLearnMore()">
      <details class="mt-2 text-[10px]">
        <summary class="text-cp-accent cursor-pointer hover:underline">Learn more</summary>
        <div class="mt-1.5 p-2 rounded bg-white/[0.02] border border-white/[0.04] text-cp-muted leading-relaxed" x-html="getLearnMore()"></div>
      </details>
    </template>
  </div>
</template>
