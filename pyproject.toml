[tool.ruff]
target-version = "py310"
line-length = 160

exclude = [
    "libs/",
    "couchpotato/lib/",
    ".git",
    "__pycache__",
    "build/",
    "dist/",
    "*.egg-info",
]

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "B"]
# S113 only (requests call with no timeout), not the whole S (bandit) family:
# a full `select = [..., "S"]` was measured at 148 findings across the repo,
# which would fail the build on merit-unrelated noise -- exactly the
# "make the number green" pressure CLAUDE.md's SonarQube rule (§3) warns
# against, just moved to ruff. S113 alone is narrow, unambiguous (a hang has
# one cause: no timeout), and was the rule that would have caught T17's
# Synology/Discord/Telegram findings before they needed a manual scan.
extend-select = ["S113"]

ignore = [
    # Bare except — legacy code uses these everywhere
    "E722",
    # Broad exception caught — too noisy for legacy code
    "BLE001",
    # Do not use mutable data structures for argument defaults — common pattern in legacy
    "B006",
    # Loop control variable not used — common in legacy
    "B007",
    # No explicit stacklevel in warnings.warn — too noisy
    "B028",
    # Star-arg unpacking after keyword — legacy patterns
    "B026",
    # f-string in exception — not worth bulk-fixing
    "UP031",
    "UP032",
    # Open with explicit encoding — too many to fix at once
    "UP015",
    # Unnecessary open mode parameters — noisy
    "UP018",
    # Line too long — handled by line-length setting, but some will still be too long
    "E501",
    # Module imported but unused — needed for __init__.py re-exports
    "F401",
    # NOTE: F821 (undefined name) is deliberately NOT ignored. It was, with
    # the note "too many false positives with dynamic imports" — but when
    # re-enabled it found 8 real latent NameErrors (Python 2 `unicode`/`long`
    # leftovers, a missing `import traceback`, a dead `ex()` helper) and zero
    # false positives. Each only crashed once its line was finally reached,
    # which is why they survived the Python 3 migration. Keep it enforced;
    # tests/unit/test_py2_leftovers.py pins that.
    # Local variable assigned but never used
    "F841",
    # Ambiguous variable name
    "E741",
    # Multiple statements on one line — legacy code style
    "E701",
    # Indentation contains tabs — legacy mixed indentation
    "W191",
    # Module level import not at top of file — legacy code structure
    "E402",
    # Comparison to None (use is/is not) — could change behaviour with __eq__
    "E711",
    # Not-in test — could change behaviour
    "E713",
    # Do not assign a lambda expression — legacy style
    "E731",
    # Comparison to True/False — could change behaviour
    "E712",
    # Function variable does not bind loop variable — legacy closures
    "B023",
    # Use is/is not for comparisons — too many to fix safely
    "F632",
    # Return in finally — legacy patterns
    "B012",
    # Unreachable code — legacy patterns
    "B020",
    # Redefined unused name — legacy
    "F811",
    # Unnecessary call to str/bytes — legacy
    "B005",
    # Trailing whitespace
    "W291",
    # No newline at end of file
    "W292",
    # Trailing semicolons
    "E703",
    # f-string without placeholders
    "F541",
    # Deprecated typing imports (Dict, List, etc.) — bulk change, do later
    "UP035",
    # Use implicit references for positional format fields
    "UP030",
    # Version block outdated for minimum Python version
    "UP036",
    # zip() without strict= — legacy code
    "B905",
    # Useless expression — legacy patterns
    "B018",
    # raise without from in except — legacy
    "B904",
    # Duplicate exception in try-except
    "B025",
    # Function call in default argument (e.g. Depends()) — FastAPI pattern
    "B008",
    # Multiple imports on one line
    "E401",
    # Not is test — minor style
    "E714",
    # Unnecessary __init__ super call
    "UP009",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/*" = ["B", "UP"]

[tool.mutmut]
# Mutation testing (mutmut 3.x). Run with: make mutation-py  (or `mutmut run`),
# or make mutation-changed for just what the branch touched.
# Scoped to start at the highest-value, best-covered module — the SQLite
# adapter, which had two critical _query_index bugs post-migration and is
# exercised by 5 unit-test files. Widen source_paths as coverage grows;
# keep the runner pointed at the tests that actually cover the mutated paths
# so each run stays fast enough to be useful.
#
# `source_paths` is the modern key — mutmut 3.x warns that the old
# `paths_to_mutate` name is deprecated. scripts/mutation_changed.py reads this
# list rather than keeping its own copy, and accepts either name.
source_paths = ["couchpotato/core/db/sqlite_adapter.py"]
# Support imports must be available inside mutmut's isolated sandbox. Copying
# these files does not expand source_paths or mutate application code outside
# the adapter. Keep the normal full gate independent of this focused selection.
also_copy = ["couchpotato/", "libs/", "scripts/", "pytest.ini", "requirements.txt"]
# Existing behavioural tests that instantiate the real adapter, plus its
# factory and migration boundaries. Keep the full repository guard suite in
# make verify: source-inspection tests cannot analyse mutmut's trampolines.
pytest_add_cli_args_test_selection = [
    "tests/integration/test_duplicate_detection.py",
    "tests/integration/test_migration.py",
    "tests/unit/test_collections.py",
    "tests/unit/test_corrupted_document_reporting.py",
    "tests/unit/test_db_factory.py",
    "tests/unit/test_fastapi_web.py",
    "tests/unit/test_hostile_session_cookies.py",
    "tests/unit/test_mark_done.py",
    "tests/unit/test_migrate_codernity_script.py",
    "tests/unit/test_movie_add_integrity.py",
    "tests/unit/test_orphan_cleanup_gate.py",
    "tests/unit/test_password_rotation_after_commit.py",
    "tests/unit/test_quality_fill.py",
    "tests/unit/test_quality_ranking.py",
    "tests/unit/test_release_download_lookup.py",
    "tests/unit/test_release_for_media_real_backend.py",
    "tests/unit/test_release_update_status_cas.py",
    "tests/unit/test_release_with_status_media_id_contract.py",
    "tests/unit/test_searcher_correct_release.py",
    "tests/unit/test_session_cookie_attributes.py",
    "tests/unit/test_session_rejection_logging.py",
    "tests/unit/test_session_revocation.py",
    "tests/unit/test_session_secret_disclosure.py",
    "tests/unit/test_session_secret_recovery.py",
    "tests/unit/test_session_secret_store.py",
    "tests/unit/test_session_secrets_not_logged.py",
    "tests/unit/test_session_upgrade_path.py",
    "tests/unit/test_sign_out_control.py",
    "tests/unit/test_sonar_s8519_first_item.py",
